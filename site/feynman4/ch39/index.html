const CHAPTER = { number: 39, title: 'Кинетическая теория газов', minutes: 12, language: 'ru', audio: false, next: '../ch40/' };

/* ---------- chapter drawing helpers ---------- */
const WALL = { stroke: COL.chalk, 'stroke-width': 4, fill: 'none' };
// A box of gas [x1, y1, x2, y2] whose right wall is a piston at x2; atoms bounce from t0 for dur seconds.
function pistonBox(p, [x1, y1, x2, y2], n, seed, t0, dur, { el = 'N', s = .7, speed = [160, 320] } = {}) {
  path(p, `M${x2} ${y1}H${x1}V${y2}H${x2}`, WALL);
  const pis = G(p, { x: x2 });
  mk('rect', { x: 0, y: y1 - 10, width: 26, height: y2 - y1 + 20, rx: 4, fill: '#3a5047', stroke: COL.task, 'stroke-width': 3 }, pis);
  const r = EL[el].r * s, box = [x1 + r, y1 + r, x2 - r, y2 - r];
  const it = gas(p, n, box, seed, { el, s, speed });
  it.forEach(a => put(a.el, gasAt(a, 0, box)));
  motion(it, (a, t) => gasAt(a, t, box), t0, dur);
  return { it, pis, box };
}
function pvAxes(p, x0, y0, w, h, t0) {
  const g = G(p, { o: 0 }); show(g, t0);
  path(g, `M${x0} ${y0 - h}V${y0}H${x0 + w}`, { stroke: COL.dim, 'stroke-width': 2 });
  T(g, 'P', { x: x0 - 12, y: y0 - h - 8, size: 28, fill: COL.dim, font: MATH });
  T(g, 'V', { x: x0 + w + 8, y: y0 + 10, size: 28, fill: COL.dim, font: MATH });
  return g;
}

    draw(iso, m('curve'), 1);
    txt(p, 'PV = const', PX + 200, PY - 110, m('curve', .5), { size: 22, fill: COL.dim, font: MATH });
    const ad = path(p, curve(P5, PX, PY, sx, sy, 1.2, 160, .5), { stroke: COL.task, 'stroke-width': 3.5 }, { d: 0 });
    draw(ad, m('law', 1), 1.5);
    txt(p, 'PV^{5/3} = const', PX + 60, PY - 390, m('law', 1.5), { size: 26, fill: COL.task, font: MATH }); subify(p.lastChild);

      wall.setAttribute('d', `M${x2} ${Y1}H${X1}V${Y2}H${x2}`); put(pis, { x: x2 });
      for (const a of it) put(a.el, { x: X1 + r + (x2 - X1 - 2 * r) * bounce(a.u, a.vu, t * heat, 0, 1), y: Y1 + r + (Y2 - Y1 - 2 * r) * bounce(a.w, a.vw, t * heat, 0, 1) });
      put(dot, { x: PX + V * sx, y: PY - sy * P5(V) });
    }, 0, D, lin);
    eq(p, '−P dV = dU,   U = PV/(γ − 1)', 120, 180, m('du'), { size: 30 });
    txt(p, 'газ греется', 330, 650, m('push', 2), { size: 26, fill: COL.task, anchor: 'middle' });
    txt(p, 'одноатомный газ: γ = 5/3', 120, 700, m('law', 3), { size: 26, fill: COL.dim });
  }],

  }], done) }],

  ['photon', 'Газ фотонов', (m, D) => {

    const g = G(p, { o: 0 }); show(g, .2);
    mk('circle', { cx: 380, cy: 430, r: 200, fill: COL.task, 'fill-opacity': .12, stroke: COL.task, 'stroke-width': 3 }, g);
    const R = rng(3), ph = Array.from({ length: 16 }, () => {
      const a = R() * 6.28, rr = R() * 150, e = vec(g, 0, 0, 34, 0, '#f3c95c', { w: 3, head: 10 });

    eq(p, 'PV = N ⟨p·v⟩ / 3', 780, 300, m('gen'), { size: 40 });

    eq(p, 'γ = 4/3:   PV^{4/3} = const', 780, 600, m('g43'), { size: 40, fill: COL.task });
  }],

    prog(q => put(mid, { x: 800 + 4 * Math.sin(q * D * 9) + 2 * Math.sin(q * D * 23) }), 0, D, lin);

    build: choice([['≈ 2,4×10¹⁹'], ['≈ 2,4×10²⁵'], ['≈ 6×10²³']], 1, 'n = P/kT = 10⁵ / (4,1×10⁻²¹) ≈ 2,4×10²⁵.',
      ['Это в кубическом сантиметре, а не в метре.', null, 'Это число Авогадро — молекул в моле, а не в кубометре.']),
  }], done, 'Практика по главе   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
