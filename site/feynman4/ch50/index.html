<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гармоники</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render"><!-- hold the first frame until the player exists, so the page transition can run -->
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../lib/atoms.js"></script>
<script src="audio/ru/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 50, title: 'Гармоники', minutes: 7, language: 'ru', audio: false, next: '../ch51/' };

/* ---------- chapter drawing helpers ---------- */
const TSPAN = 4 * Math.PI;   // two periods
const sq = N => x => { let s = 0; for (let k = 1; k <= N; k += 2) s += Math.sin(k * x) / k; return 4 / Math.PI * s; };
const tone = x => Math.sin(x) + .5 * Math.sin(2 * x + 1) + .35 * Math.sin(3 * x + .3) + .2 * Math.sin(5 * x + 2);
const HAM = [1, .5, .35, 0, .2];

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Гармоники', (m, D) => introCard(m, D, 'Звук', 50, 'Гармоники', 'Из чего состоит музыкальный звук')],

  ['tone', 'Тон', (m) => {
    const p = panel(0);
    head(p, 'Периодический звук', .2);
    path(p, 'M140 330H900', { stroke: COL.faint, 'stroke-width': 2 });
    draw(path(p, curve(tone, 140, 330, 760 / TSPAN, 80, TSPAN, 500), { stroke: COL.task, 'stroke-width': 3.5 }, { d: 0 }), m('wave'), 1.5);
    const br = G(p, { o: 0 }); show(br, m('wave', 2)); path(br, `M140 460V470H${140 + 380}V460`, { stroke: COL.dim, 'stroke-width': 2 }); T(br, 'T', { x: 330, y: 500, size: 26, fill: COL.dim, font: MATH, anchor: 'middle' });
    path(p, 'M1000 620H1500', { stroke: COL.dim, 'stroke-width': 2 });
    HAM.forEach((h, i) => {
      if (!h) return;
      const b = mk('rect', { x: 1020 + i * 95, y: 620 - h * 300, width: 50, height: h * 300, rx: 4, fill: COL.good }, p); put(b, { o: 0 }); show(b, m('harm', i * .4));
    });
    HAM.forEach((_, i) => T(p, `${i + 1}ω`, { x: 1045 + i * 95, y: 655, size: 22, fill: COL.dim, anchor: 'middle', font: MATH }));
    txt(p, 'тембр = набор гармоник', 1250, 280, m('timbre'), { size: 28, fill: COL.good, anchor: 'middle' });
  }],

  ['square', 'Ступенька', (m, D) => {
    const p = panel(0);
    head(p, 'Прямоугольная волна из синусов', .2);
    path(p, 'M160 400H1440', { stroke: COL.faint, 'stroke-width': 2 });
    const tgt = path(p, (() => { let d = ''; for (let k = 0; k < 4; k++) { const x = 160 + k * 320, y = k % 2 ? 520 : 280; d += (k ? `L${x} ${y}` : `M${x} ${y}`) + `H${x + 320}`; if (k < 3) d += `V${k % 2 ? 280 : 520}`; } return d; })(),
      { stroke: COL.dim, 'stroke-width': 2, 'stroke-dasharray': '8 8' });
    const e = path(p, '', { stroke: COL.task, 'stroke-width': 3.5, fill: 'none' });
    const ts = [m('s1'), m('s3'), m('s5'), m('many')], Ns = [1, 3, 5, 39];
    prog(q => { const t = q * D; let N = 0; ts.forEach((tt, i) => { if (t >= tt) N = Ns[i]; });
      e.setAttribute('d', N ? curve(sq(N), 160, 400, 1280 / TSPAN, 120, TSPAN, 800) : ''); }, 0, D, lin);
    eq(p, 'f = 4/π (sin x + sin 3x/3 + sin 5x/5 + …)', 800, 660, m('s3'), { size: 34, anchor: 'middle' });
  }],

  ['coef', 'Коэффициенты', (m) => {
    const p = panel(0);
    head(p, 'Как найти амплитуды', .2);
    eq(p, '⟨cos nωt · cos mωt⟩ = 0,  n ≠ m', 800, 260, m('ortho'), { size: 40, anchor: 'middle' });
    eq(p, 'aₙ = (2/T) ∫ f(t) cos nωt dt', 800, 400, m('an'), { size: 50, anchor: 'middle', fill: COL.task });
    eq(p, 'bₙ = (2/T) ∫ f(t) sin nωt dt', 800, 500, m('an', 6), { size: 44, anchor: 'middle' });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz({ x: 300, y: 200, w: 1000, cls: 'side' }, [{
    id: 'c-harm', prompt: ['Струна звучит с основной частотой 220 Гц. Какова частота её четвёртой гармоники?'],
    build: blanks([{ parts: [{ box: '880' }, ' Гц'], why: '4 · 220 = 880 Гц.', hint: 'Гармоники — nω.' }]),
  }], done) }],

  ['conson', 'Консонанс', (m) => {
    const p = panel(0);
    head(p, 'Почему квинта звучит приятно', .2);
    const XF = f => 160 + f * 120;
    path(p, 'M160 300H1480M160 500H1480', { stroke: COL.dim, 'stroke-width': 2 });
    T(p, 'нота 1', { x: 150, y: 260, size: 24, fill: COL.task, anchor: 'end' }); T(p, 'нота 2', { x: 150, y: 460, size: 24, fill: COL.good, anchor: 'end' });
    for (let n = 1; n <= 10; n++) { const l = path(p, `M${XF(n * 1)} 300V200`, { stroke: COL.task, 'stroke-width': 6 }); put(l, { o: 0 }); show(l, m('oct', n * .1)); }
    for (let n = 1; n <= 6; n++) { const l = path(p, `M${XF(n * 1.5)} 500V400`, { stroke: COL.good, 'stroke-width': 6 }); put(l, { o: 0 }); show(l, m('fifth', n * .1)); }
    for (let n = 1; n <= 3; n++) { const c = mk('circle', { cx: XF(3 * n), cy: 350, r: 20, fill: 'none', stroke: COL.chalk, 'stroke-width': 2.5 }, p); put(c, { o: 0 }); show(c, m('why', n * .3)); }
    txt(p, 'квинта 3 : 2 — 3-я гармоника нижней = 2-я верхней', 800, 620, m('fifth', 1), { size: 30, anchor: 'middle', fill: COL.chalk });
    txt(p, 'несовпадающие близкие — биения', 800, 680, m('why', 3), { size: 26, anchor: 'middle', fill: COL.dim });
  }],

  ['energy', 'Энергия', (m) => {
    const p = panel(0);
    head(p, 'Теорема об энергии', .2);
    eq(p, '⟨f²⟩ = a₀² + ½ Σ (aₙ² + bₙ²)', 800, 380, m('eth'), { size: 52, anchor: 'middle', fill: COL.task });
    txt(p, 'энергия звука — сумма энергий гармоник', 800, 480, m('mean'), { size: 30, anchor: 'middle', fill: COL.good });
  }],

  ['nonlin', 'Нелинейность', (m) => {
    const p = panel(0);
    head(p, 'Нелинейный отклик', .2);
    path(p, 'M140 280H700M900 280H1460', { stroke: COL.faint, 'stroke-width': 2 });
    draw(path(p, curve(Math.cos, 140, 280, 560 / TSPAN, 90, TSPAN), { stroke: COL.good, 'stroke-width': 3.5 }, { d: 0 }), m('in'), 1.2);
    txt(p, 'вход: cos ωt', 420, 420, m('in'), { size: 26, fill: COL.good, anchor: 'middle' });
    vec(p, 730, 280, 870, 280, COL.dim);
    draw(path(p, curve(x => Math.cos(x) + .5 * Math.cos(x) ** 2, 900, 280, 560 / TSPAN, 90, TSPAN), { stroke: COL.task, 'stroke-width': 3.5 }, { d: 0 }), m('out', 3), 1.2);
    txt(p, 'выход: x + εx²', 1180, 420, m('out', 3), { size: 26, fill: COL.task, anchor: 'middle' });
    eq(p, 'cos²ωt = ½ + ½ cos 2ωt', 800, 560, m('sq'), { size: 44, anchor: 'middle', fill: COL.task });
    txt(p, 'появились 2ω и постоянная составляющая', 800, 630, m('sq', 3), { size: 28, anchor: 'middle', fill: COL.dim });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz({ x: 300, y: 200, w: 1000, cls: 'side' }, [{
    id: 'c-fifth', prompt: ['Ноты 200 Гц и 300 Гц (квинта). На какой наименьшей частоте совпадают их гармоники?'],
    build: blanks([{ parts: [{ box: '600' }, ' Гц'], why: '3·200 = 2·300 = 600 Гц.', hint: 'Наименьшее общее кратное.' }]),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    head(p, 'Итоги главы', .2);
    wrapList(p, m, [['Периодический звук = сумма гармоник nω.', 'w1'], ['aₙ = (2/T)∫ f cos nωt dt.', 'w2'],
      ['Консонанс — совпадение гармоник.', 'w3'], ['Нелинейность рождает гармоники.', 'w4']]);
  }],

  ['final1', 'Практика', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-sq', prompt: ['В прямоугольной волне амплитуда первой гармоники 1. Какова амплитуда пятой?'],
    build: blanks([{ parts: [{ box: '1/5' }], why: 'Ряд: sin x + sin 3x/3 + sin 5x/5 …', hint: 'Амплитуда n-й гармоники ∝ 1/n.' }]),
  }, {
    id: 'p-even', prompt: ['Есть ли в прямоугольной волне чётные гармоники (2ω, 4ω…)?'],
    build: choice([['нет — только нечётные'], ['да, все гармоники'], ['только чётные']], 0, 'Половины периода симметричны со сменой знака — чётные гармоники выпадают.', [null, 'Посмотрите на ряд: sin x, sin 3x, sin 5x…', 'Наоборот.']),
  }], done, 'Практика по главе   1 из 1') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
