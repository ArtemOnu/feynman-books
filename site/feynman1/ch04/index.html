<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сохранение энергии</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render"><!-- hold the first frame until the player exists, so the page transition can run -->
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../lib/atoms.js"></script>
<script src="audio/ru/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 4, title: 'Сохранение энергии', minutes: 14, language: 'ru', audio: false, next: '../ch05/' };

/* ---------- chapter drawing helpers ---------- */
const BLOCK = '#e8a0c8';
function cube(p, x, y, s = 40) {
  const g = G(p, { x, y });
  mk('rect', { x: -s / 2, y: -s / 2, width: s, height: s, rx: 5, fill: BLOCK, stroke: '#a8607f', 'stroke-width': 2 }, g);
  return g;
}
function ball(p, x, y, colr = COL.whole, r = 24) {
  const g = G(p, { x, y });
  mk('circle', { r, fill: colr, stroke: COL.board, 'stroke-width': 2 }, g);
  return g;
}
function weight(p, label, { x = 0, y = 0, w = 70, h = 50, colr = COL.dim, o = 1 } = {}) {
  const g = G(p, { x, y, o });
  mk('path', { d: `M${-w / 2} ${h / 2}L${-w / 2 + 8} ${-h / 2}H${w / 2 - 8}L${w / 2} ${h / 2}Z`, fill: '#55665f', stroke: colr, 'stroke-width': 2 }, g);
  T(g, label, { y: 9, size: 22, fill: COL.chalk, anchor: 'middle', weight: 600 });
  return g;
}
const eq = (p, str, x, y, t0, { size = 34, fill = COL.chalk, anchor = 'start' } = {}) => txt(p, str, x, y, t0, { size, fill, anchor, font: MATH });

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Сохранение энергии', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Большие идеи · Глава 4', { x: 800, y: 330, size: 30, fill: COL.dim, anchor: 'middle' });
    T(g, 'Сохранение энергии', { x: 800, y: 440, size: 88, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = txt(scene, 'Число, которое не меняется, что бы ни случилось', 800, 560, m('sub'), { size: 34, fill: COL.task, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['blocks', 'Кубики', (m, D) => {
    const p = panel(0);
    head(p, 'Притча о кубиках', .2);
    const room = G(p, { o: 0 }); show(room, .2);
    const cubes = [];
    for (let k = 0; k < 28; k++) cubes.push(cube(room, 160 + (k % 7) * 54, 180 + Math.floor(k / 7) * 54));
    const vis = T(p, '', { x: 160, y: 440, size: 30, fill: COL.chalk, weight: 600 });
    // window
    const win = G(p, { o: 0 }); show(win, m('window', -.3));
    mk('rect', { x: 600, y: 150, width: 130, height: 140, fill: 'rgba(134,201,232,.12)', stroke: COL.dim, 'stroke-width': 3 }, win);
    path(win, 'M665 150V290M600 220H730', { stroke: COL.dim, 'stroke-width': 2 });
    T(win, 'окно', { x: 665, y: 320, size: 22, fill: COL.dim, anchor: 'middle' });
    const out_ = [26, 27], toBox = [23, 24, 25], toBath = [20, 21, 22];
    const tw0 = m('window');
    out_.forEach((k, i) => tw(cubes[k], { x: 800 + i * 50, y: 330 }, tw0 + i * .3, 1.2));
    // the box on a scale
    const tb = m('box');
    const bx = G(p, { o: 0 }); show(bx, tb - .3);
    mk('rect', { x: 250, y: 520, width: 170, height: 110, rx: 6, fill: '#7a5a3a', stroke: '#a8805a', 'stroke-width': 3 }, bx);
    mk('rect', { x: 230, y: 632, width: 210, height: 14, fill: COL.dim }, bx);
    const wt = T(bx, 'вес ящика: 1 кг', { x: 335, y: 680, size: 24, fill: COL.task, anchor: 'middle' });
    toBox.forEach((k, i) => { tw(cubes[k], { x: 290 + i * 45, y: 590 }, tb + 1 + i * .4, 1); });
    // the bath
    const tba = m('bath');
    const bt = G(p, { o: 0 }); show(bt, tba - .3);
    path(bt, 'M520 500V640H860V500', { stroke: COL.dim, 'stroke-width': 4 });
    const water = mk('rect', { x: 523, y: 560, width: 334, height: 77, fill: 'rgba(134,201,232,.35)' }, bt);
    const lv = T(bt, 'уровень воды: 40 см', { x: 690, y: 680, size: 24, fill: WATER, anchor: 'middle' });
    toBath.forEach((k, i) => { tw(cubes[k], { x: 600 + i * 70, y: 610, o: .55 }, tba + 1 + i * .5, 1.1); });
    tw(water, { a_y: 545, a_height: 92 }, tba + 1.5, 1.5);
    prog(q => {
      const t = q * D;
      let v = 28;
      out_.forEach((k, i) => { if (t > tw0 + i * .3 + .6) v--; });
      toBox.forEach((k, i) => { if (t > tb + 1 + i * .4 + .5) v--; });
      toBath.forEach((k, i) => { if (t > tba + 1 + i * .5 + .5) v--; });
      vis.textContent = t < m('count') ? '' : `видно: ${v}`;
      wt.textContent = `вес ящика: ${t > tb + 2.4 ? '2,5' : '1'} кг`;
      lv.textContent = `уровень воды: ${t > tba + 2.6 ? '41' : '40'} см`;
    }, 0, D, lin);
    // mother's formula
    const ts = m('sum');
    [['видно:', '20', COL.chalk], ['за окном:', '2', COL.dim], ['в ящике: (2,5 − 1) / 0,5 =', '3', COL.task], ['в ванне: (41 − 40) / (1/3) =', '3', WATER]].forEach(([a, b, c], i) => {
      eq(p, a, 960, 200 + i * 62, ts + i * .7, { size: 30, fill: c });
      eq(p, b, 1480, 200 + i * 62, ts + i * .7, { size: 30, fill: c, anchor: 'end' });
    });
    const line = path(p, 'M960 440H1490', { stroke: COL.chalk, 'stroke-width': 2 }); put(line, { o: 0 }); show(line, ts + 3);
    eq(p, 'всего = 28', 1480, 492, ts + 3.3, { size: 40, fill: COL.good, anchor: 'end' });
  }],

  ['forms', 'Формы энергии', (m) => {
    const p = panel(0);
    head(p, 'Энергия: кубиков нет', .2);
    const c = cube(p, 800, 210, 70); put(c, { o: 0 }); show(c, .3);
    const x = G(p, { o: 0 }); show(x, m('nocubes'));
    path(x, 'M750 160L850 260M850 160L750 260', { stroke: COL.bad, 'stroke-width': 8 });
    txt(p, 'есть только формулы', 800, 320, m('nocubes', .6), { size: 30, anchor: 'middle', fill: COL.dim });
    const F = [['тяготения', COL.whole], ['кинетическая', COL.task], ['тепловая', COL.bad], ['упругая', COL.good], ['электрическая', COL.int], ['химическая', COL.irr], ['излучения', COL.real], ['ядерная', COL.nat], ['массы: mc²', COL.rat]];
    F.forEach(([s, col], i) => {
      const g = G(p, { x: 220 + (i % 5) * 290, y: 430 + Math.floor(i / 5) * 100, o: 0, s: .7 });
      mk('rect', { x: -125, y: -32, width: 250, height: 64, rx: 32, fill: 'rgba(10,16,14,.6)', stroke: col, 'stroke-width': 2.5 }, g);
      T(g, s, { y: 9, size: 26, fill: col, anchor: 'middle', weight: 600 });
      tw(g, { o: 1, s: 1 }, m('forms', i * .45), .45, back);
    });
    eq(p, 'Σ (все формы) = const', 800, 690, m('total'), { size: 44, fill: COL.good, anchor: 'middle' });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz({ x: 200, y: 120, w: 1200, cls: 'side' }, [{
    id: 'c-blocks', prompt: ['Кубик весит 0,5 кг и поднимает уровень воды на 1/3 см. Пустой ящик весит 1 кг.'],
    build: blanks([
      { parts: ['Ящик весит 3 кг: в нём ', { box: '4' }, ' кубика'], why: '(3 − 1) / 0,5 = 4.', hint: 'Вычтите вес пустого ящика и разделите на вес кубика.' },
      { parts: ['Вода поднялась с 40 до 42 см: в ней ', { box: '6' }, ' кубиков'], why: '(42 − 40) / (1/3) = 6.', hint: 'Каждый кубик поднимает воду на 1/3 см.' },
    ]),
  }], done) }],

  ['lever', 'Обратимые машины', (m) => {
    const p = panel(0);
    head(p, 'Подъёмные машины', .2);
    const piv = [560, 500];
    const lev = G(p, { x: piv[0], y: piv[1], o: 0 }); show(lev, .3);
    path(lev, 'M-420 0H140', { stroke: COL.chalk, 'stroke-width': 8 });
    weight(lev, '1', { x: -400, y: -32, w: 56, h: 46 });
    [0, 1, 2].forEach(k => weight(lev, '1', { x: 120, y: -32 - k * 48, w: 56, h: 46 }));
    path(p, `M${piv[0]} ${piv[1] + 4}l-30 60h60z`, { fill: COL.task });
    T(p, '× 3 ближе к опоре', { x: 680, y: 640, size: 24, fill: COL.dim, anchor: 'middle' });
    const tm = m('machine'), tr = m('rev');
    tw(lev, { r: -9 }, tm, 1.6); tw(lev, { r: 9 }, tr, 2.2); tw(lev, { r: 0 }, tr + 2.4, 1.4);
    txt(p, 'вечный двигатель невозможен', 1000, 200, m('perp'), { size: 30, fill: COL.bad, weight: 600 });
    txt(p, 'обратимая машина работает в обе стороны', 1000, 260, tr + .3, { size: 26 });
    const tb = m('best');
    const lines = [['B: 1 кг ↓ 1 м  →  3 кг ↑ Y', COL.chalk], ['A назад: 3 кг ↓ X  →  1 кг ↑ 1 м', COL.whole], ['если Y > X: 3 кг ↑ (Y − X) даром ✗', COL.bad], ['значит Y ≤ X: обратимая — лучшая', COL.good]];
    lines.forEach(([s, c], i) => eq(p, s, 1000, 360 + i * 64, tb + i * 2.2, { size: 28, fill: c }));
  }],

  ['shelves', 'Шары и полки', (m, D) => {
    const p = panel(0);
    head(p, 'Сколько это — X?', .2);
    const FL = 660, MT = 360, X = MT / 3, r = 24;
    const yAt = h => FL - h - r;   // ball centre resting at height h (pixels)
    const st_ = G(p, { o: 0 }); show(st_, .3);
    path(st_, `M100 ${FL}H1300`, { stroke: COL.dim, 'stroke-width': 3 });
    // the stand, 1 m
    mk('rect', { x: 490, y: FL - MT, width: 60, height: MT, fill: 'rgba(85,102,95,.6)', stroke: COL.dim, 'stroke-width': 2 }, st_);
    path(st_, `M450 ${FL}V${FL - MT}M440 ${FL}H460M440 ${FL - MT}H460`, { stroke: COL.task, 'stroke-width': 2 });
    T(st_, '1 м', { x: 430, y: FL - MT / 2 + 8, size: 26, fill: COL.task, anchor: 'end' });
    // the rack: shelves at X, 2X, 3X (the floor is the lowest place)
    [1, 2, 3].forEach(k => path(st_, `M960 ${FL - k * X}H1040`, { stroke: COL.chalk, 'stroke-width': 4 }));
    path(st_, `M1044 ${FL}V${FL - 3 * X - 10}`, { stroke: COL.dim, 'stroke-width': 3 });
    path(st_, `M1090 ${FL}V${FL - X}M1080 ${FL}H1100M1080 ${FL - X}H1100`, { stroke: COL.whole, 'stroke-width': 2 });
    T(st_, 'X', { x: 1110, y: FL - X / 2 + 8, size: 26, fill: COL.whole, font: MATH });
    T(st_, 'стеллаж', { x: 1000, y: FL + 36, size: 22, fill: COL.dim, anchor: 'middle' });
    // platform with three shelves 0, X, 2X
    const plat = G(p, { o: 0 }); show(plat, .3);
    [0, 1, 2].forEach(k => path(plat, `M820 ${FL - k * X}H900`, { stroke: COL.chalk, 'stroke-width': 4 }));
    path(plat, `M816 ${FL}V${FL - 2 * X - 30}`, { stroke: COL.dim, 'stroke-width': 3 });
    T(plat, 'платформа', { x: 860, y: FL + 36, size: 22, fill: COL.dim, anchor: 'middle' });
    // pulley and rope from the platform to the single ball
    const pul = [700, 200];
    mk('circle', { cx: pul[0], cy: pul[1], r: 14, fill: 'none', stroke: COL.dim, 'stroke-width': 3 }, st_);
    const rope = path(p, '', { stroke: COL.dim, 'stroke-width': 2 });
    const one = ball(p, 520, yAt(MT), COL.task);
    const B = [0, 1, 2].map(k => ball(p, 1000, yAt(k * X)));
    [one, ...B].forEach(b => { put(b, { o: 0 }); show(b, m('a')); });
    const tb = m('b'), tc = m('c'), td = m('d');
    B.forEach((b, k) => tw(b, { x: 860 }, tb + k * .25, .9));
    // the machine: the single ball rolls off and goes down 1 m; the platform (and its balls) go up X
    tw(one, { x: 640 }, tc, .5);
    tw(one, { y: yAt(0) }, tc + .5, 2.2);
    tw(plat, { y: -X }, tc + .5, 2.2);
    B.forEach(b => tw(b, { y: st(b).y - X }, tc + .5, 2.2));
    B.forEach((b, k) => tw(b, { x: 1000 }, td + k * .25, .9));
    prog(q => {
      const t = q * D, o_ = st(one), pl = st(plat);
      rope.setAttribute('d', `M${o_.x} ${o_.y - r}L${pul[0] - 12} ${pul[1]}L${pul[0] + 12} ${pul[1]}L860 ${FL - 2 * X - 30 + pl.y}`);
      put(rope, { o: clamp01((t - m('a')) / .5) });
    }, 0, D, lin);
    const tn = m('net');
    const ng = G(p, { o: 0 }); show(ng, tn);
    [1, 2].forEach(k => mk('circle', { cx: 1000, cy: yAt(k * X), r: r + 8, fill: 'none', stroke: COL.good, 'stroke-width': 3 }, ng));
    mk('circle', { cx: 1000, cy: yAt(0), r: r + 2, fill: 'none', stroke: COL.dim, 'stroke-width': 2, 'stroke-dasharray': '5 6' }, ng);
    vec(ng, 1160, yAt(0), 1160, yAt(3 * X) + 10, COL.task, { w: 3, head: 12 });
    T(ng, '3X', { x: 1180, y: yAt(1.5 * X) + 8, size: 28, fill: COL.task, font: MATH });
    vec(ng, 600, yAt(MT) + 4, 600, yAt(0) - 10, COL.task, { w: 3, head: 12 });
    T(ng, '1 м', { x: 580, y: yAt(MT / 2), size: 26, fill: COL.task, anchor: 'end' });
    txt(p, 'два шара — где были', 1180, 320, tn + 1, { size: 24, fill: COL.good });
    const te = m('e');
    eq(p, '3X > 1 м → вечный двигатель ✗', 120, 150, te, { size: 28, fill: COL.bad });
    eq(p, '3X < 1 м → обратный ход ✗', 120, 200, te + 4, { size: 28, fill: COL.bad });
    const tx = m('x');
    const dash = path(p, `M520 ${FL - MT}H1000`, { stroke: COL.good, 'stroke-width': 2, 'stroke-dasharray': '8 8' }); put(dash, { o: 0 }); show(dash, tx);
    eq(p, '3X = 1 м  ⇒  X = 1/3 м', 800, 120, tx + .4, { size: 40, fill: COL.good, anchor: 'middle' });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz({ x: 300, y: 140, w: 1000, cls: 'side' }, [{
    id: 'c-machine', prompt: ['Обратимая машина опускает 2 кг на 1,5 м. На какую высоту она поднимет груз 6 кг?'],
    build: blanks([{ parts: ['h = ', { box: '0,5' }, ' м'], why: 'Сумма «вес × высота» не меняется: 2 · 1,5 = 6 · h, h = 0,5 м.', hint: 'Приравняйте произведения веса на высоту.' }]),
  }], done) }],

  ['pe', 'Потенциальная энергия', (m) => {
    const p = panel(0);
    head(p, 'Энергия тяготения', .2);
    // 1 kg × 1 m and 3 kg × 1/3 m: equal areas
    const sc = 240;
    const a = G(p, { o: 0 }); show(a, .3);
    mk('rect', { x: 200, y: 620 - sc, width: 80, height: sc, fill: 'rgba(240,180,90,.35)', stroke: COL.task, 'stroke-width': 2 }, a);
    T(a, '1 кг × 1 м', { x: 240, y: 660, size: 26, fill: COL.task, anchor: 'middle', font: MATH });
    mk('rect', { x: 400, y: 620 - sc / 3, width: 240, height: sc / 3, fill: 'rgba(134,201,232,.35)', stroke: COL.whole, 'stroke-width': 2 }, a);
    T(a, '3 кг × 1/3 м', { x: 520, y: 660, size: 26, fill: COL.whole, anchor: 'middle', font: MATH });
    T(a, '=', { x: 340, y: 590, size: 44, fill: COL.chalk, anchor: 'middle', font: MATH });
    eq(p, 'Σ (вес × высота) не меняется', 760, 260, m('rule'), { size: 34 });
    eq(p, 'Eп = вес × высота = mgh', 760, 360, m('pe'), { size: 40, fill: COL.task });
    eq(p, 'ΔE = F · s', 760, 470, m('work'), { size: 40, fill: COL.good });
    txt(p, 'изменение энергии = сила × путь, на котором она действует', 760, 520, m('work', .5), { size: 24, fill: COL.dim });
  }],

  ['incline', 'Наклонная плоскость', (m, D) => {
    const p = panel(0);
    head(p, 'Наклонная плоскость и цепочка Стевина', .2);
    const U = 100, A = [260, 280], Bp = [260, 280 + 3 * U], Cp = [260 + 4 * U, 280 + 3 * U];
    const tri = G(p, { o: 0 }); show(tri, m('tri'));
    path(tri, `M${A[0]} ${A[1]}L${Bp[0]} ${Bp[1]}L${Cp[0]} ${Cp[1]}Z`, { stroke: COL.chalk, 'stroke-width': 4, fill: 'rgba(236,232,220,.05)' });
    T(tri, '3', { x: A[0] + 18, y: (A[1] + Bp[1]) / 2 + 8, size: 28, fill: COL.dim, font: MATH });
    T(tri, '4', { x: (Bp[0] + Cp[0]) / 2, y: Bp[1] + 36, size: 28, fill: COL.dim, font: MATH, anchor: 'middle' });
    T(tri, '5', { x: (A[0] + Cp[0]) / 2 + 26, y: (A[1] + Cp[1]) / 2 - 10, size: 28, fill: COL.dim, font: MATH });
    mk('circle', { cx: A[0] - 6, cy: A[1] - 10, r: 14, fill: 'none', stroke: COL.dim, 'stroke-width': 3 }, tri);
    // block on the slope; W hangs on the left
    const ang = Math.atan2(3, 4), ux = -Math.cos(ang), uy = -Math.sin(ang);   // up the slope
    const blk = G(p, { o: 0 }); show(blk, m('tri', .4));
    mk('rect', { x: -26, y: -40, width: 52, height: 40, rx: 4, fill: COL.task, transform: `rotate(${-ang * 180 / Math.PI})` }, blk);
    T(blk, '1 кг', { x: 0, y: -50, size: 20, fill: COL.task, anchor: 'middle' });
    const W = weight(p, 'W', { w: 50, h: 40, colr: COL.whole, o: 0 }); show(W, m('tri', .4));
    const rope = path(p, '', { stroke: COL.dim, 'stroke-width': 2 });
    const tmv = m('move');
    prog(q => {
      const t = q * D, s = 1.6 * U * smooth(tmv, tmv + 2.5, t) * (1 - smooth(tmv + 4, tmv + 5.5, t));
      const bx = Cp[0] - 70 + ux * s, by = Cp[1] - 42 + uy * s;
      put(blk, { x: bx, y: by + 2 }); put(W, { x: A[0] - 44, y: 400 + s });
      rope.setAttribute('d', `M${bx} ${by - 18}L${A[0] - 2} ${A[1] - 22}Q${A[0] - 20} ${A[1] - 26} ${A[0] - 30} ${A[1] - 10}L${A[0] - 44} ${380 + s}`);
      put(rope, { o: clamp01((t - m('tri') - .4) / .5) });
    }, 0, D, lin);
    eq(p, 'W ↓ 5,  1 кг ↑ 3', 120, 200, tmv + 1, { size: 30, fill: COL.whole });
    eq(p, '5·W = 3·1 кг  ⇒  W = 3/5 кг', 120, 690, m('ans'), { size: 34, fill: COL.good });
    // Stevin's wreath
    const ts = m('stevin');
    const sv = G(p, { o: 0 }); show(sv, ts);
    const P1 = [1000, 220], P2 = [1000, 460], P3 = [1320, 460];
    path(sv, `M${P1[0]} ${P1[1]}L${P2[0]} ${P2[1]}L${P3[0]} ${P3[1]}Z`, { stroke: COL.chalk, 'stroke-width': 3 });
    const bead = (x, y, c = COL.int) => mk('circle', { cx: x, cy: y, r: 17, fill: c, stroke: COL.board, 'stroke-width': 2 }, sv);
    for (let k = 0; k < 3; k++) bead(P1[0] - 19, P1[1] + 40 + k * 80);
    for (let k = 0; k < 5; k++) { const f = (k + .5) / 5; bead(P1[0] + (P3[0] - P1[0]) * f + 12, P1[1] + (P3[1] - P1[1]) * f - 15); }
    const loop = G(sv);
    for (let k = 0; k < 9; k++) { const f = k / 8, x = P2[0] - 19 + (P3[0] + 38 - P2[0]) * f; mk('circle', { cx: x, cy: P2[1] + 30 + 150 * Math.sin(Math.PI * f), r: 17, fill: COL.dim, stroke: COL.board, 'stroke-width': 2 }, loop); }
    tw(loop, { o: .2 }, ts + 6, 1);
    txt(p, 'нижняя часть уравновешена сама', 1160, 700, ts + 6, { size: 24, fill: COL.dim, anchor: 'middle' });
    txt(p, '3 звена = 5 звеньев на склоне', 1160, 180, ts + 8, { size: 26, fill: COL.int, anchor: 'middle' });
  }],

  ['jack', 'Домкрат', (m, D) => {
    const p = panel(0);
    head(p, 'Домкрат', .2);
    const C = [500, 480];
    const jk = G(p, { o: 0 }); show(jk, m('jack'));
    mk('path', { d: `M${C[0] - 90} 660L${C[0] - 50} 540H${C[0] + 50}L${C[0] + 90} 660Z`, fill: '#55665f', stroke: COL.dim, 'stroke-width': 2 }, jk);
    const screw = G(jk);
    for (let k = 0; k < 8; k++) path(screw, `M${C[0] - 30} ${540 - k * 14}L${C[0] + 30} ${532 - k * 14}`, { stroke: COL.dim, 'stroke-width': 3 });
    const load = weight(screw, '1 т', { x: C[0], y: 400, w: 120, h: 70 });
    const handTip = G(p, { o: 0 }); show(handTip, m('jack'));
    const arm = path(p, '', { stroke: COL.task, 'stroke-width': 6 });
    mk('circle', { r: 12, fill: COL.task }, handTip);
    path(p, `M${C[0]} 470H${C[0] + 300}`, { stroke: COL.faint, 'stroke-width': 1.5, 'stroke-dasharray': '6 6' });
    T(p, '1 м', { x: C[0] + 150, y: 455, size: 24, fill: COL.dim, anchor: 'middle' });
    const tt = m('turn');
    const cnt = T(p, '', { x: 900, y: 240, size: 30, fill: COL.task, font: MATH });
    prog(q => {
      const t = q * D, turns = 4 * smooth(tt, tt + 7, t), a = turns * 2 * Math.PI;
      const hx = C[0] + 300 * Math.cos(a), hy = 470 + 60 * Math.sin(a);
      put(handTip, { x: hx, y: hy }); arm.setAttribute('d', `M${C[0]} 470L${hx} ${hy}`); put(arm, { o: clamp01((t - m('jack')) / .5) });
      put(screw, { y: -3 * turns / 4 });   // 1 cm = 3 px at this scale (1 m = 300 px)
      cnt.textContent = t > tt ? `оборотов: ${turns.toFixed(1).replace('.', ',')}` : '';
    }, 0, D, lin);
    eq(p, 'путь руки: 4 · 2π · 1 м ≈ 25,1 м', 900, 310, tt + 7, { size: 30 });
    eq(p, 'груз поднялся на 1 см (в масштабе)', 900, 360, tt + 7.5, { size: 24, fill: COL.dim });
    eq(p, 'F · 25,1 м = 1000 кг · 0,01 м', 900, 450, m('force'), { size: 30 });
    eq(p, 'F ≈ 0,4 кг', 900, 520, m('force', 1), { size: 40, fill: COL.good });
  }],

  ['rod', 'Возможные перемещения', (m, D) => {
    const p = panel(0);
    head(p, 'Стержень на опоре', .2);
    const L = 1000, X0 = 300, Y = 470, pv = [X0 + L, Y];   // 8 m = 1000 px
    const rod = G(p, { x: pv[0], y: pv[1], o: 0 }); show(rod, .3);
    mk('rect', { x: -L, y: -8, width: L, height: 16, fill: '#8f8a7a' }, rod);
    const w60 = weight(rod, '60', { x: -500, y: -36, w: 76, h: 54 }), w100 = weight(rod, '100', { x: -250, y: -36, w: 84, h: 54 });
    path(p, `M${pv[0]} ${pv[1] + 8}l-26 46h52z`, { fill: COL.task });
    const pul = [X0, 220];
    mk('circle', { cx: pul[0] - 14, cy: pul[1], r: 14, fill: 'none', stroke: COL.dim, 'stroke-width': 3 }, p);
    const Wt = weight(p, 'W', { x: X0 - 28, y: 0, w: 50, h: 44, colr: COL.whole });
    const rope = path(p, '', { stroke: COL.dim, 'stroke-width': 2 });
    const dims = G(p, { o: 0 }); show(dims, m('loads'));
    path(dims, `M${X0} 610H${pv[0]}M${X0} 600V620M${pv[0]} 600V620`, { stroke: COL.dim, 'stroke-width': 2 });
    T(dims, '8 м', { x: X0 + 500, y: 645, size: 24, fill: COL.dim, anchor: 'middle' });
    T(dims, '4 м', { x: pv[0] - 250, y: 560, size: 22, fill: COL.dim, anchor: 'middle' });
    T(dims, '2 м', { x: pv[0] - 125, y: 530, size: 22, fill: COL.dim, anchor: 'middle' });
    const tsh = m('shift'), lift = 40, th = -Math.atan2(lift, L) * 180 / Math.PI;
    prog(q => {
      const t = q * D, f = smooth(tsh, tsh + 1.5, t);
      put(rod, { r: th * f });
      const ly = Y - lift * f;
      rope.setAttribute('d', `M${X0} ${ly}V${pul[1]}M${pul[0] - 28} ${pul[1]}V${330 + lift * f}`);
      put(Wt, { y: 352 + lift * f });
    }, 0, D, lin);
    const lb = G(p, { o: 0 }); show(lb, tsh + 1.6);
    T(lb, '+4 см', { x: X0 + 20, y: Y - 60, size: 24, fill: COL.task });
    T(lb, '+2 см', { x: X0 + 500, y: Y - 100, size: 24, fill: COL.task, anchor: 'middle' });
    T(lb, '+1 см', { x: X0 + 750, y: Y - 100, size: 24, fill: COL.task, anchor: 'middle' });
    T(lb, '−4 см', { x: X0 - 80, y: 440, size: 24, fill: COL.whole, anchor: 'end' });
    T(lb, '(сдвиг преувеличен)', { x: X0 + 500, y: 700, size: 20, fill: COL.faint, anchor: 'middle' });
    eq(p, '−4·W + 2·60 + 1·100 = 0', 1290, 170, m('eq'), { size: 34, anchor: 'middle' });
    eq(p, 'W = 55 кг', 1290, 230, m('eq', 1.5), { size: 40, fill: COL.good, anchor: 'middle' });
  }],

  ['q3', 'Быстрая проверка', () => {}, { ask: done => quiz({ x: 470, y: 590, w: 760, cls: 'side' }, [{
    id: 'c-rod', prompt: ['Груз 100 кг заменили на 200 кг. Какой W теперь удержит стержень?'],
    build: blanks([{ parts: ['W = ', { box: '80' }, ' кг'], why: '−4W + 2·60 + 1·200 = 0 ⇒ W = 320/4 = 80 кг.', hint: 'Перемещения те же: 4, 2 и 1 см.' }]),
  }], done) }],

  ['pendulum', 'Кинетическая энергия', (m, D) => {
    const p = panel(0);
    head(p, 'Маятник', .2);
    const piv = [480, 140], L = 400, A = 40 * Math.PI / 180, w = 1.7;
    path(p, `M${piv[0] - 60} ${piv[1]}H${piv[0] + 60}`, { stroke: COL.dim, 'stroke-width': 4 });
    const str = path(p, '', { stroke: COL.chalk, 'stroke-width': 3 });
    const bob = ball(p, 0, 0, COL.task, 30);
    const arc = path(p, `M${piv[0] - L * Math.sin(A)} ${piv[1] + L * Math.cos(A)}A${L} ${L} 0 0 0 ${piv[0] + L * Math.sin(A)} ${piv[1] + L * Math.cos(A)}`, { stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 8' });
    const td = m('down');
    // energy bars
    const bars = G(p, { o: 0 }); show(bars, m('up'));
    const H = 300, base = 600;
    path(bars, `M960 ${base - H}H1120`, { stroke: COL.good, 'stroke-width': 2, 'stroke-dasharray': '8 6' });
    T(bars, 'сумма не меняется', { x: 1130, y: base - H - 14, size: 22, fill: COL.good });
    const bp = mk('rect', { x: 980, y: base, width: 120, height: 0, fill: COL.whole }, bars), bk = mk('rect', { x: 980, y: base, width: 120, height: 0, fill: COL.task }, bars);
    T(bars, 'Eп — потенциальная', { x: 1120, y: base - 20, size: 24, fill: COL.whole });
    T(bars, 'Eк — кинетическая', { x: 1120, y: base - H + 30, size: 24, fill: COL.task });
    prog(q => {
      const t = q * D, th = t < td ? A : A * Math.cos(w * (t - td));
      const x = piv[0] + L * Math.sin(th), y = piv[1] + L * Math.cos(th);
      put(bob, { x, y }); str.setAttribute('d', `M${piv[0]} ${piv[1]}L${x} ${y}`);
      const pe = (Math.cos(th) - Math.cos(A)) / (1 - Math.cos(A));   // 0 at the top, 1 at the bottom: share of kinetic
      bp.setAttribute('height', H * (1 - pe)); bp.setAttribute('y', base - H * (1 - pe));
      bk.setAttribute('height', H * pe); bk.setAttribute('y', base - H);
    }, 0, D, lin);
    eq(p, 'Eк = W·H,  H = v²/2g', 940, 190, m('ke'), { size: 30 });
    eq(p, 'Eк = Wv²/2g = mv²/2', 940, 240, m('ke', 1.5), { size: 34, fill: COL.task });
  }],

  ['other', 'Другие формы энергии', (m, D) => {
    const p = panel(0);

    path(p, 'M150 352H900', { stroke: COL.faint, 'stroke-width': 2 });
    const bars = G(p, { o: 0 }); show(bars, ts);
    const base = 640, H = 200, names = [['упругая', COL.good], ['кинетическая', COL.task], ['тепло', COL.bad]];
    const R_ = names.map(([s, c], i) => { T(bars, s, { x: 200 + i * 230, y: base + 34, size: 22, fill: c, anchor: 'middle' }); return mk('rect', { x: 150 + i * 230, y: base, width: 100, height: 0, fill: c }, bars); });
    const th = G(p, { o: 0 }); show(th, m('heat'));
    mk('rect', { x: 860, y: 450, width: 24, height: 170, rx: 12, fill: 'none', stroke: COL.dim, 'stroke-width': 3 }, th);
    mk('circle', { cx: 872, cy: 630, r: 20, fill: COL.bad }, th);
    const lvl = mk('rect', { x: 866, y: 560, width: 12, height: 70, fill: COL.bad }, th);
    prog(q => {
      const t = q * D, s = Math.max(0, t - ts), amp = Math.exp(-s / 6) * (t > ts ? 1 : 1), x0 = 520;
      const x = x0 + 160 * amp * Math.cos(2.4 * s);
      put(mass, { x, y: 310 });
      let d = 'M150 310';
      for (let k = 1; k <= 16; k++) d += `L${150 + (x - 40 - 150) * k / 16} ${310 + (k % 2 ? -18 : 18) * (k < 16 ? 1 : 0)}`;
      spr.setAttribute('d', d);
      const tot = 1, ka = amp * amp, el = ka * Math.cos(2.4 * s) ** 2, kin = ka * Math.sin(2.4 * s) ** 2, heat = tot - ka;
      [el, kin, heat].forEach((v, i) => { R_[i].setAttribute('height', H * v); R_[i].setAttribute('y', base - H * v); });
      lvl.setAttribute('height', 70 + 80 * heat); lvl.setAttribute('y', 630 - 70 - 80 * heat);
    }, 0, D, lin);
    const tl = m('list');
    [['электрическая', COL.int], ['излучения', COL.real], ['химическая', COL.irr], ['ядерная', COL.nat]].forEach(([s, c], i) => txt(p, s, 1050, 230 + i * 60, tl + i * .5, { size: 30, fill: c, weight: 600 }));
    eq(p, 'E = mc²', 1050, 520, m('mass'), { size: 56, fill: COL.rat });
  }],

    [['электрический заряд', COL.int], ['число барионов (p, n: +1)', COL.good], ['число лептонов (e⁻: +1, e⁺: −1)', COL.whole]].forEach(([s, c], i) => txt(p, s, 1260, 280 + i * 90, tc + 1 + i * 1.2, { size: 28, anchor: 'middle', fill: c }));

  }, {

    build: choice([['≈ 0,32 кг'], ['≈ 3,2 кг'], ['≈ 0,16 кг'], ['≈ 1 кг']], 0,
      'Путь руки на 1 см подъёма: 10 · 2π · 0,5 м ≈ 31,4 м. F = 1000 кг · 0,01 м / 31,4 м ≈ 0,32 кг.',
      [null, 'Проверьте единицы: подъём 1 см = 0,01 м.', 'Длина окружности 2π·r, а не π·r.', 'Посчитайте путь руки: 10 оборотов по 2π · 0,5 м.']),
  }], done, 'Практика по главе   1 из 2') }],

  ['final2', 'Практика 2', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-heat', prompt: ['Пружина с грузом перестала колебаться. Куда делась её энергия?'],

      'Энергия сохраняется: она перешла во внутреннее, тепловое движение атомов пружины и воздуха — термометр это покажет.',
