<script>
'use strict';
const CHAPTER = { number: 2, title: 'Основные физические воззрения', minutes: 14, language: 'ru', audio: false, next: '../ch03/' };

/* ---------- chapter drawing helpers ---------- */
const PLUS = COL.bad, MINUS = COL.whole;
function charge(p, sign, { x = 0, y = 0, r = 26, o = 1 } = {}) {
  const g = G(p, { x, y, o });
  mk('circle', { r, fill: sign > 0 ? PLUS : MINUS, stroke: COL.board, 'stroke-width': 2 }, g);
  T(g, sign > 0 ? '+' : '−', { y: r * .38, size: r * 1.15, fill: COL.board, weight: 700, anchor: 'middle' });
  return g;
}
// Chess pieces drawn around their centre.
function bishop(p, { x = 0, y = 0, o = 1, light = true } = {}) {
  const g = G(p, { x, y, o }), f = light ? COL.chalk : '#30403a', s = light ? '#55665f' : COL.chalk;
  path(g, 'M-18 22H18L14 13H-14Z', { fill: f, stroke: s, 'stroke-width': 2 });
  path(g, 'M-10 13C-15 0 -12 -10 0 -22C12 -10 15 0 10 13Z', { fill: f, stroke: s, 'stroke-width': 2 });
  mk('circle', { cy: -26, r: 4.5, fill: f, stroke: s, 'stroke-width': 2 }, g);
  path(g, 'M4 -13L-4 -3', { stroke: s, 'stroke-width': 2.5 });
  return g;
}
function pawn(p, { x = 0, y = 0, o = 1 } = {}) {
  const g = G(p, { x, y, o });
  path(g, 'M-17 22H17L13 13H-13Z', { fill: COL.chalk, stroke: '#55665f', 'stroke-width': 2 });
  path(g, 'M-9 13L-5 -4H5L9 13Z', { fill: COL.chalk, stroke: '#55665f', 'stroke-width': 2 });
  mk('circle', { cy: -12, r: 10, fill: COL.chalk, stroke: '#55665f', 'stroke-width': 2 }, g);
  return g;
}
// A card with a word on it, centred on (x, y).
function card_(p, str, x, y, { w = 230, colr = COL.chalk, o = 0 } = {}) {
  const g = G(p, { x, y, o });
  mk('rect', { x: -w / 2, y: -32, width: w, height: 64, rx: 14, fill: 'rgba(10,16,14,.5)', stroke: colr, 'stroke-width': 2.5 }, g);
  T(g, str, { y: 10, size: 27, fill: colr, anchor: 'middle', weight: 600 });
  return g;
}
// A wavy photon arrow from (0, 0) to the right, length L.
function photon(p, L, colr = COL.int, { x = 0, y = 0, r = 0, o = 1 } = {}) {
  const g = G(p, { x, y, r, o });
  let d = 'M0 0';
  for (let s = 0; s <= L - 18; s += 3) d += `L${s} ${8 * Math.sin(s / 7)}`;
  path(g, d, { stroke: colr, 'stroke-width': 3 });
  mk('path', { d: `M${L} 0L${L - 16} -8L${L - 16} 8Z`, fill: colr }, g);
  return g;
}

/* ---------- data ---------- */
const BANDS = [   // [label, log f from, log f to, row]
  ['электрические помехи', 1.7, 2.6, 0], ['радиоволны', 5.7, 6.7, 1], ['УКВ, телевидение', 7.6, 8.5, 0], ['радиолокация', 9.5, 10.5, 1],
  ['свет', 14.7, 15.0, 0], ['рентген', 17.2, 19, 1], ['гамма (ядра)', 20.5, 21.5, 0], ['гамма (ускорители)', 23.5, 24.4, 1], ['космические лучи', 26.4, 27.2, 0]];
const LX = lf => 150 + (lf - 2) * 52;
const PARTS = [   // [symbol, mass MeV, column, group]
  ['e⁻', .511, 'L', 'lept'], ['ν', 0, 'L', 'lept'], ['μ⁻', 105.7, 'L', 'lept'],
  ['π⁻', 139.6, -1, 'mes'], ['π⁰', 135.0, 0, 'mes'], ['π⁺', 139.6, 1, 'mes'], ['K⁻', 493.7, -1, 'mes'], ['K⁰', 497.6, 0, 'mes'], ['K⁺', 493.7, 1, 'mes'], ['η', 547.9, 0, 'mes'],
  ['p', 938.3, 1, 'bar'], ['n', 939.6, 0, 'bar'], ['Λ', 1115.7, 0, 'bar'], ['Σ⁻', 1197.4, -1, 'bar'], ['Σ⁰', 1192.6, 0, 'bar'], ['Σ⁺', 1189.4, 1, 'bar'],
  ['Ξ⁻', 1321.7, -1, 'bar'], ['Ξ⁰', 1314.9, 0, 'bar'], ['Ω⁻', 1672.5, -1, 'bar']];
const MY = mev => 710 - mev * .31, COLX = { L: 560, '-1': 800, 0: 1000, 1: 1200 };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Основные физические воззрения', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Картина мира · Глава 2', { x: 800, y: 330, size: 30, fill: COL.dim, anchor: 'middle' });
    T(g, 'Основные физические воззрения', { x: 800, y: 440, size: 76, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = txt(scene, 'Каковы правила игры, за которой мы наблюдаем?', 800, 560, m('sub'), { size: 34, fill: COL.task, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['chess', 'Правила игры', (m) => {
    const p = panel(0);
    head(p, 'Мир как шахматная партия', .2);
    const X0 = 160, Y0_ = 140, c = 66, sq = (i, j) => [X0 + i * c + c / 2, Y0_ + j * c + c / 2];
    const board = G(p, { o: 0 }); show(board, .2);
    const cells = {};
    for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
      cells[i + ',' + j] = mk('rect', { x: X0 + i * c, y: Y0_ + j * c, width: c, height: c, fill: (i + j) % 2 ? '#2a3833' : '#6f7d76' }, board);
    }
    mk('rect', { x: X0, y: Y0_, width: 8 * c, height: 8 * c, fill: 'none', stroke: COL.dim, 'stroke-width': 3 }, board);
    const route = [[2, 7], [5, 4], [7, 6], [3, 2], [1, 4], [4, 7], [7, 4]];
    const b = bishop(p, { x: sq(2, 7)[0], y: sq(2, 7)[1], o: 0 }); show(b, .4);
    const tb = m('bishop');
    route.slice(1).forEach(([i, j], k) => {
      const [x, y] = sq(i, j);
      tw(b, { x, y }, tb + k * 1.6, 1.1);
      const hl = mk('rect', { x: X0 + i * c + 4, y: Y0_ + j * c + 4, width: c - 8, height: c - 8, rx: 6, fill: 'none', stroke: COL.task, 'stroke-width': 3, opacity: 0 }, p);
      show(hl, tb + k * 1.6 + 1);
    });
    const pw = pawn(p, { x: sq(6, 1)[0], y: sq(6, 1)[1], o: 0 }); show(pw, .4);
    const tp = m('promote');
    tw(pw, { y: sq(6, 0)[1] }, tp, .8);
    hide(pw, tp + 1.2, .3);
    const nb = bishop(p, { x: sq(6, 0)[0], y: sq(6, 0)[1], o: 0 });
    tw(nb, { o: 1 }, tp + 1.2, .4);
    const ring = mk('circle', { cx: sq(6, 0)[0], cy: sq(6, 0)[1], r: 42, fill: 'none', stroke: COL.bad, 'stroke-width': 4, opacity: 0 }, p);
    show(ring, tp + 1.6);
    txt(p, 'мы только наблюдаем', 760, 220, m('watch'), { size: 30, fill: COL.dim });
    txt(p, 'правило: слон ходит по диагонали', 760, 300, tb, { size: 30 });
    txt(p, 'следствие: слон не меняет цвет поля', 760, 370, m('color'), { size: 30, fill: COL.task });
    txt(p, 'новое правило: пешка превратилась', 760, 470, tp + 1.6, { size: 30, fill: COL.bad });
    txt(p, 'в слона на белом поле!', 760, 512, tp + 1.6, { size: 30, fill: COL.bad });
  }],

  ['q1', 'Быстрая проверка', () => {}, { ask: done => quiz({ x: 760, y: 560, w: 760, cls: 'side' }, [{
    id: 'c-bishop', prompt: ['Слон ходит только по диагонали. Что при этом не меняется, пока пешки не превращаются?'],
    build: choice([['цвет поля, на котором стоит слон'], ['число клеток до края доски'], ['ряд, в котором стоит слон']], 0,
      'По диагонали обе координаты меняются на одно и то же число шагов, сумма i + j меняется на чётное число — цвет поля сохраняется.',
      [null, 'Это расстояние как раз меняется от хода к ходу.', 'Каждый ход по диагонали меняет ряд.']),
  }], done) }],

  ['unify', 'Объединение', (m) => {
    const p = panel(0);
    head(p, 'Классы явлений и их слияние', .2);
    const C_ = {
      heat: card_(p, 'теплота', 220, 240), mech: card_(p, 'механика', 480, 240), el: card_(p, 'электричество', 760, 240),
      mag: card_(p, 'магнетизм', 1040, 240), light: card_(p, 'свет', 1300, 240), chem: card_(p, 'химия', 560, 380), props: card_(p, 'свойства веществ', 900, 380, { w: 270 }),
    };
    Object.values(C_).forEach((e, i) => show(e, .3 + i * .12));
    const merge = (keys, x, y, label, colr, t0) => {
      keys.forEach(k => { tw(C_[k], { x, y }, t0, 1.2); hide(C_[k], t0 + 1.1, .3); });
      const r = card_(p, label, x, y, { w: 360, colr }); put(r, { s: .6 }); tw(r, { o: 1, s: 1 }, t0 + 1.1, .5, back);
    };
    merge(['heat', 'mech'], 300, 580, 'механика атомов', COL.task, m('heat'));
    merge(['el', 'mag', 'light'], 800, 580, 'электромагнитное поле', COL.whole, m('em'));
    merge(['chem', 'props'], 1300, 580, 'квантовая химия', COL.good, m('chem'));
  }],

  ['stage', 'Сцена до 1920 года', (m, D) => {
    const p = panel(0);
    head(p, 'Физика до 1920 года', .2);
    // a wireframe of space
    const sp = G(p, { o: 0 }); show(sp, m('space'));
    const iso = (x, y, z) => [380 + (x - y) * 52, 420 + (x + y) * 30 - z * 60];
    for (let k = 0; k <= 4; k++) {
      [[[k, 0, 0], [k, 4, 0]], [[0, k, 0], [4, k, 0]], [[0, 0, k * .75], [4, 0, k * .75]], [[0, 0, k * .75], [0, 4, k * .75]], [[k, 0, 0], [k, 0, 3]], [[0, k, 0], [0, k, 3]]]
        .forEach(([a, b]) => { const A = iso(...a), B = iso(...b); path(sp, `M${A[0]} ${A[1]}L${B[0]} ${B[1]}`, { stroke: COL.faint, 'stroke-width': 1.5 }); });
    }
    T(sp, 'пространство', { x: 380, y: 700, size: 30, fill: COL.dim, anchor: 'middle' });
    // a clock
    const ck = G(p, { x: 1350, y: 230, o: 0 }); show(ck, m('time'));
    mk('circle', { r: 80, fill: 'none', stroke: COL.dim, 'stroke-width': 4 }, ck);
    for (let k = 0; k < 12; k++) path(ck, `M${70 * Math.sin(k * Math.PI / 6)} ${-70 * Math.cos(k * Math.PI / 6)}L${62 * Math.sin(k * Math.PI / 6)} ${-62 * Math.cos(k * Math.PI / 6)}`, { stroke: COL.dim, 'stroke-width': 3 });
    const hand = path(ck, 'M0 0V-58', { stroke: COL.task, 'stroke-width': 4 });
    prog(q => put(hand, { r: q * D * 30 }), 0, D, lin);
    T(ck, 'время', { y: 125, size: 30, fill: COL.dim, anchor: 'middle' });
    // a particle: straight line, then a force bends the path
    const ti = m('inertia'), tf = m('force');
    const pt = atom(p, 'He', { x: 760, y: 640, o: 0 }); show(pt, ti);
    const tr = path(p, '', { stroke: COL.task, 'stroke-width': 3, 'stroke-dasharray': '6 8' });
    const F = G(p, { o: 0 }); vec(F, 0, 0, 0, 70, COL.bad, { w: 4 }); T(F, 'F', { x: 16, y: 50, size: 30, fill: COL.bad, font: MATH });
    const at = t => { const s = Math.max(0, t - ti), x = 760 + 90 * s, y0 = 640 - 30 * s, f = Math.max(0, t - tf); return { x, y: y0 + 9 * f * f }; };
    prog(q => {
      const t = q * D;
      const P_ = at(t); put(pt, P_);
      let d = '';
      for (let u = ti; u <= t; u += .1) { const A = at(u); d += (d ? 'L' : 'M') + A.x.toFixed(1) + ' ' + A.y.toFixed(1); }
      tr.setAttribute('d', d);
      put(F, { x: P_.x, y: P_.y + 22, o: t >= tf ? 1 : 0 });
    }, 0, D, lin);
    txt(p, 'инерция: прямо и равномерно', 760, 470, ti + .5, { size: 28, fill: COL.task });
    txt(p, 'пока не подействует сила', 760, 510, tf + .3, { size: 28, fill: COL.bad });
  }],

  ['charge', 'Заряды', (m) => {
    const p = panel(0);
    head(p, 'Электричество: заряды двух сортов', .2);
    const mini = G(p, { o: 0 }); show(mini, m('kinds'));
    [[[+1, +1], 300, 'отталкиваются'], [[-1, -1], 800, 'отталкиваются'], [[+1, -1], 1300, 'притягиваются']].forEach(([[a, b], x, s]) => {
      charge(mini, a, { x: x - 50, y: 210 }); charge(mini, b, { x: x + 50, y: 210 });
      const rep = a === b;
      vec(mini, x - 80, 210, x - (rep ? 150 : 82) + (rep ? 0 : 64), 210, rep ? COL.bad : COL.good, { w: 3, head: 12 });
      vec(mini, x + 80, 210, x + (rep ? 150 : 82) - (rep ? 0 : 64), 210, rep ? COL.bad : COL.good, { w: 3, head: 12 });
      T(mini, s, { x, y: 280, size: 26, fill: rep ? COL.bad : COL.good, anchor: 'middle' });
    });
    const tp = m('pair');
    const pair = G(p, { o: 0 }); show(pair, tp);
    charge(pair, +1, { x: 420, y: 500 }); charge(pair, -1, { x: 476, y: 500 });
    T(pair, 'нейтральная пара', { x: 448, y: 570, size: 26, fill: COL.dim, anchor: 'middle' });
    const q3 = charge(p, +1, { x: 1350, y: 500, o: 0 }); show(q3, m('far'));
    const zero = txt(p, 'сила ≈ 0', 1350, 450, m('far', .6), { size: 28, fill: COL.dim, anchor: 'middle' });
    const tn = m('near');
    hide(zero, tn, .3);
    tw(q3, { x: 560 }, tn, 2.2);
    const arr = G(p, { o: 0 }); vec(arr, 590, 452, 515, 452, COL.good, { w: 4 }); show(arr, tn + 2.4);
    txt(p, 'вблизи: ближний минус перетягивает', 700, 440, tn + 2.6, { size: 26, fill: COL.good });
  }],

  ['sand', 'Две песчинки', (m) => {
    const p = panel(0);
    head(p, 'Насколько электричество сильнее тяготения', .2);
    const g = G(p, { o: 0 }); show(g, m('grains'));
    mk('circle', { cx: 220, cy: 380, r: 12, fill: '#c9a86a' }, g); mk('circle', { cx: 1380, cy: 380, r: 12, fill: '#c9a86a' }, g);
    T(g, '1 мм', { x: 220, y: 345, size: 26, fill: COL.dim, anchor: 'middle' }); T(g, '1 мм', { x: 1380, y: 345, size: 26, fill: COL.dim, anchor: 'middle' });
    path(g, 'M240 440H1360M240 428V452M1360 428V452', { stroke: COL.dim, 'stroke-width': 2 });
    T(g, '30 м', { x: 800, y: 480, size: 30, fill: COL.dim, anchor: 'middle', font: MATH });
    const tf = m('force');
    const F = G(p, { o: 0 }); show(F, tf);
    vec(F, 250, 380, 520, 380, COL.bad, { w: 10, head: 30 }); vec(F, 1350, 380, 1080, 380, COL.bad, { w: 10, head: 30 });
    txt(p, 'без равновесия зарядов:', 800, 280, tf + .3, { size: 28, anchor: 'middle', fill: COL.dim });
    txt(p, 'F ≈ 4·10⁶ тонн', 800, 340, tf + .5, { size: 48, anchor: 'middle', fill: COL.bad, weight: 600, font: MATH });
    txt(p, 'q ≈ 70 Кл на песчинке;  F = kq² / r²', 800, 560, tf + 2, { size: 28, anchor: 'middle', font: MATH });
    txt(p, 'тяготение между ними ≈ 10⁻²⁵ Н', 800, 620, tf + 3, { size: 28, anchor: 'middle', fill: COL.whole });
  }],

  ['atom', 'Устройство атома', (m, D) => {
    const p = panel(0);
    head(p, 'Атом: ядро и электроны', .2);
    const A = G(p, { x: 450, y: 420 });
    const cloud = mk('circle', { r: 230, fill: 'rgba(134,201,232,.10)', stroke: 'rgba(134,201,232,.35)', 'stroke-width': 2, 'stroke-dasharray': '6 10' }, A);
    put(cloud, { o: 0 }); show(cloud, .3);
    const nuc = G(A, { o: 0 }); show(nuc, m('nucleus'));
    const R = rng(8);
    for (let k = 0; k < 12; k++) { const a = k * 2.4, r = 8 + 9 * Math.sqrt(k); atom(nuc, k % 2 ? 'C' : 'O', { x: r * Math.cos(a), y: r * Math.sin(a), r: 9 }); }
    const els = Array.from({ length: 6 }, (_, k) => {
      const a = k / 6 * 6.283 + R(), rr = 90 + R() * 110;
      return { el: put(mk('circle', { r: 9, fill: MINUS, stroke: COL.board, 'stroke-width': 2 }, A), { o: 0 }), x0: rr * Math.cos(a), y0: rr * Math.sin(a), ph: R() * 6, w: 2.4 };
    });
    els.forEach(e => show(e.el, m('nucleus', 1)));
    motion(els, (q, t) => wobble(q, t, 26), 0, D);
    txt(p, 'ядро: протоны (+) и нейтроны', 760, 300, m('nucleus', .5), { size: 28, fill: PLUS });
    txt(p, 'электроны (−) — лёгкие, вокруг', 760, 350, m('nucleus', 1.2), { size: 28, fill: MINUS });
    txt(p, '(ядро нарисовано в 10⁴ раз крупнее)', 760, 395, m('nucleus', 1.8), { size: 22, fill: COL.faint });
    const tn = m('number');
    const tab = G(p, { o: 0 }); show(tab, tn);
    ['H', 'He', 'Li', 'Be', 'B', 'C', 'N', 'O'].forEach((s, i) => {
      const x = 780 + i * 82, hl = s === 'C' || s === 'O';
      mk('rect', { x: x - 36, y: 470, width: 72, height: 84, rx: 8, fill: hl ? 'rgba(240,180,90,.18)' : 'rgba(10,16,14,.4)', stroke: hl ? COL.task : COL.faint, 'stroke-width': 2 }, tab);
      T(tab, String(i + 1), { x, y: 496, size: 20, fill: COL.dim, anchor: 'middle' });
      T(tab, s, { x, y: 538, size: 34, fill: hl ? COL.task : COL.chalk, anchor: 'middle', font: MATH, weight: 600 });
    });
    txt(p, '6 электронов → углерод · 8 → кислород', 780 - 36, 610, tn + 1.5, { size: 28 });
  }],

  ['q2', 'Быстрая проверка', () => {
    const p = panel(0);
    const XS = [330, 800, 1270], N = [6, 8, 7];
    S.q2 = XS.map((cx, i) => {
      const g = G(p, { o: 0 }); show(g, .2 + i * .1);
      mk('circle', { cx, cy: 300, r: 150, fill: 'rgba(134,201,232,.08)', stroke: 'rgba(134,201,232,.3)', 'stroke-width': 2 }, g);
      mk('circle', { cx, cy: 300, r: 14, fill: PLUS }, g);
      for (let k = 0; k < N[i]; k++) { const a = k / N[i] * 6.283 - 1.57, r = k % 2 ? 110 : 75; mk('circle', { cx: cx + r * Math.cos(a), cy: 300 + r * Math.sin(a), r: 10, fill: MINUS }, g); }
      T(g, 'АБВ'[i], { x: cx, y: 500, size: 34, fill: COL.dim, anchor: 'middle', weight: 600 });
      return g;
    });
  }, { ask: done => quiz({ x: 220, y: 560, w: 1160, cls: 'side' }, [{
    id: 'c-oxygen', prompt: ['Щёлкните по атому кислорода (нейтральному).'],
    build: pickEls(S.q2.map((el, i) => ({ el, box: [[330, 800, 1270][i] - 160, 140, 320, 380], label: 'Атом ' + 'АБВ'[i] })), 1,
      'Восемь электронов — элемент номер 8, кислород.',
      i => i === 0 ? 'Посчитайте электроны: их 6 — это углерод.' : 'Здесь 7 электронов — это азот.'),
  }], done) }],

  ['field', 'Поле и волны', (m, D) => {
    const p = panel(0);
    head(p, 'Электромагнитное поле', .2);
    const ts = m('shake'), c = 160;
    const q = charge(p, +1, { x: 220, y: 300, o: 0 }); show(q, .3);
    const line = path(p, 'M250 300H1450', { stroke: COL.whole, 'stroke-width': 3 });
    put(line, { o: 0 }); show(line, m('field'));
    const far = charge(p, -1, { x: 1380, y: 300, r: 18, o: 0 }); show(far, m('field', .5));
    const yq = t => t < ts ? 0 : -70 * Math.sin(2.2 * (t - ts)) * smooth(ts, ts + 1, t);
    prog(u => {
      const t = u * D;
      put(q, { y: 300 + yq(t) });
      let d = '';
      for (let x = 250; x <= 1450; x += 8) { const tt = t - (x - 220) / c; d += (d ? 'L' : 'M') + x + ' ' + (300 + .8 * yq(tt)).toFixed(1); }
      line.setAttribute('d', d);
      put(far, { y: 300 + .35 * yq(t - (1380 - 220) / c) });
    }, 0, D, lin);
    txt(p, 'изменения поля бегут с конечной скоростью: запаздывание', 800, 470, ts + 3, { size: 28, anchor: 'middle', fill: COL.whole });

      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 36, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика 1', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-ratio', prompt: ['Во сколько раз атом больше ядра, если размер атома 10⁻⁸ см, а ядра 10⁻¹³ см?'],
    build: blanks([{ parts: ['в ', { box: '100000' }, ' раз'], why: '10⁻⁸ / 10⁻¹³ = 10⁵ = 100 000.', hint: 'Разделите степени: 10⁻⁸ / 10⁻¹³ = 10⁻⁸⁺¹³.' }]),
  }, {
    id: 'p-sand', prompt: ['Песчинки раздвинули с 30 до 60 м. Во сколько раз уменьшилась бы сила между ними?'],
    build: blanks([{ parts: ['в ', { box: '4' }, ' раза'], why: 'Сила обратно пропорциональна квадрату расстояния: (60/30)² = 4.', hint: 'Электрическая сила ∝ 1/r².' }]),
  }, {
    id: 'p-waves', prompt: ['Свет, радиоволны и рентгеновские лучи отличаются друг от друга…'],
    build: choice([['только частотой'], ['скоростью в пустоте'], ['тем, что лишь свет — электромагнитная волна']], 0,
      'Это всё электромагнитные волны; в пустоте они бегут с одной скоростью, а отличаются частотой.',
      [null, 'В пустоте все электромагнитные волны распространяются со скоростью света.', 'Радиоволны и рентген — тоже электромагнитные волны.']),
  }], done, 'Практика по главе   1 из 2') }],

  ['final2', 'Практика 2', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-classes', prompt: ['К какому классу относится частица?'],
    build: grid([
      { parts: ['электрон'], ans: ['l'], why: 'Лептон: с ядрами сильно не взаимодействует.' },
      { parts: ['мюон'], ans: ['l'], why: 'Лептон: «тяжёлый электрон», в 207 раз массивнее.' },
      { parts: ['пион π⁺'], ans: ['m'], why: 'Мезон: кварк и антикварк.' },
      { parts: ['каон K⁰'], ans: ['m'], why: 'Мезон.' },
      { parts: ['протон'], ans: ['b'], why: 'Барион: три кварка uud.' },
      { parts: ['лямбда Λ'], ans: ['b'], why: 'Барион, масса 1116 МэВ.' },
    ], [['l', 'лептон', COL.whole, '1'], ['m', 'мезон', COL.good, '2'], ['b', 'барион', COL.task, '3']], { text: true }),
  }, {
    id: 'p-annihilation', prompt: ['Электрон встречает позитрон. Что получается?'],
    build: choice([['гамма-кванты (фотоны)'], ['протон'], ['атом водорода'], ['ничего: они отталкиваются']], 0,
      'Частица и античастица аннигилируют: e⁺ + e⁻ → γ + γ.',
      [null, 'Протону неоткуда взяться: масса протона почти в 2000 раз больше.', 'Атом водорода — это протон и электрон, а не позитрон и электрон.', 'Заряды у них разные — они притягиваются.']),
  }, {
    id: 'p-balance', prompt: ['Почему мы обычно не замечаем огромных электрических сил между телами?'],
    build: choice([['заряды в телах почти точно уравновешены'], ['электрические силы действуют только внутри атомов'], ['их компенсирует тяготение']], 0,
      'Плюсов и минусов почти поровну; заметен лишь крошечный избыток.',
      [null, 'Наэлектризованная расчёска притягивает бумажки на расстоянии — силы действуют и снаружи.', 'Тяготение в 10³⁶ раз слабее — оно ничего не может скомпенсировать.']),
  }], done, 'Практика по главе   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
