<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вероятность</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render"><!-- hold the first frame until the player exists, so the page transition can run -->
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../lib/atoms.js"></script>
<script src="audio/ru/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 6, title: 'Вероятность', minutes: 14, language: 'ru', audio: false, next: '../ch07/' };

/* ---------- chapter data: a seeded coin-tossing experiment ---------- */
const HEADS = COL.task, TAILS = COL.whole;
const coinR = rng(2024);
const SERIES = Array.from({ length: 100 }, () => Array.from({ length: 30 }, () => coinR() < .5));
const COUNTS = SERIES.map(s => s.filter(Boolean).length);
const HIST = Array.from({ length: 31 }, (_, k) => COUNTS.filter(c => c === k).length);
const binom = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; };
const eq = (p, str, x, y, t0, { size = 34, fill = COL.chalk, anchor = 'start' } = {}) => txt(p, str, x, y, t0, { size, fill, anchor, font: MATH });
function coinEl(p, heads, { x = 0, y = 0, r = 16, o = 1 } = {}) {
  const g = G(p, { x, y, o });
  mk('circle', { r, fill: heads ? HEADS : TAILS, stroke: COL.board, 'stroke-width': 2 }, g);
  T(g, heads ? 'О' : 'Р', { y: r * .38, size: r * 1.05, fill: COL.board, anchor: 'middle', weight: 700 });
  return g;
}
const walkR = rng(77);
const WALKS = [0, 1, 2].map(() => { const d = [0]; for (let k = 0; k < 30; k++) d.push(d[k] + (walkR() < .5 ? 1 : -1)); return d; });
const gauss = (x, s) => Math.exp(-x * x / (2 * s * s)) / (s * Math.sqrt(2 * Math.PI));

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Вероятность', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Большие идеи · Глава 6', { x: 800, y: 330, size: 30, fill: COL.dim, anchor: 'middle' });
    T(g, 'Вероятность', { x: 800, y: 440, size: 96, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = txt(scene, '«Истинная логика нашего мира — подсчёт вероятностей»', 800, 560, m('sub'), { size: 32, fill: COL.task, anchor: 'middle' });
    const who = txt(scene, '— Дж. К. Максвелл', 800, 610, m('sub', .6), { size: 26, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8); hide(who, D - .9, .8);
  }],

  ['guess', 'Вероятность — догадка', (m, D) => {
    const p = panel(0);
    head(p, 'Что такое вероятность', .2);
    const tc = m('coin');
    const c = G(p, { x: 320, y: 380, o: 0 }); show(c, tc);
    const face = mk('ellipse', { rx: 90, ry: 90, fill: HEADS, stroke: COL.board, 'stroke-width': 4 }, c);
    const lab = T(c, 'О', { y: 30, size: 90, fill: COL.board, anchor: 'middle', weight: 700 });
    prog(q => {
      const t = q * D, a = Math.max(0, t - tc) * 9, k = Math.cos(a);
      face.setAttribute('ry', 90 * Math.abs(k)); face.setAttribute('fill', k > 0 ? HEADS : TAILS);
      lab.textContent = k > 0 ? 'О' : 'Р'; put(lab, { s: 1, o: Math.abs(k) > .3 ? 1 : 0 });
      lab.setAttribute('transform', `scale(1 ${Math.max(.01, Math.abs(k))})`);
    }, 0, D, lin);
    txt(p, 'орёл или решка?', 320, 540, tc + .5, { size: 28, fill: COL.dim, anchor: 'middle' });
    eq(p, 'P(A) = Nₐ / N', 760, 300, m('def'), { size: 52, fill: COL.task });
    txt(p, 'Nₐ — ожидаемое число исходов A', 760, 360, m('def', 1), { size: 26, fill: COL.dim });
    txt(p, 'N — число одинаковых повторений', 760, 400, m('def', 1.5), { size: 26, fill: COL.dim });
    eq(p, 'm равноправных исходов: P = 1/m', 760, 520, m('equal'), { size: 36 });
    txt(p, 'монета: 1/2 · кубик: 1/6', 760, 570, m('equal', 1), { size: 26, fill: COL.dim });
  }],

  ['q1', 'Быстрая проверка', () => {}, { ask: done => quiz({ x: 760, y: 610, w: 760, cls: 'side' }, [{
    id: 'c-cards', prompt: ['В колоде 36 карт. Какова вероятность вытащить даму пик?'],
    build: blanks([{ parts: ['P = ', { box: '1/36' }], why: '36 равноправных исходов, нужный — один: P = 1/36.', hint: 'Сколько всего равноправных исходов и сколько из них нужных?' }]),
  }], done) }],

  ['fluct', 'Флуктуации', (m, D) => {
    const p = panel(0);
    head(p, '100 серий по 30 бросков', .2);
    const tr = m('run');
    const row = G(p, { o: 0 }); show(row, tr);
    SERIES[0].forEach((h, k) => {
      const e = coinEl(row, h, { x: 130 + k * 44, y: 180, r: 17, o: 0 });
      show(e, tr + k * .12, .15);
    });
    txt(p, `орлов в этой серии: ${COUNTS[0]}`, 1470, 245, tr + 3.8, { size: 28, fill: HEADS, anchor: 'end', weight: 600 });
    // histogram: series land one by one
    const tm = m('many');
    const X_ = k => 300 + (k - 5) * 48, Y0 = 690, U = 18;
    const ax = G(p, { o: 0 }); show(ax, tm);
    path(ax, `M${X_(5) - 30} ${Y0}H${X_(25) + 30}`, { stroke: COL.dim, 'stroke-width': 2 });
    for (let k = 5; k <= 25; k += 5) T(ax, String(k), { x: X_(k), y: Y0 + 32, size: 22, fill: COL.dim, anchor: 'middle', font: MATH });
    T(ax, 'k — число орлов в серии', { x: X_(25) + 30, y: Y0 + 60, size: 22, fill: COL.dim, anchor: 'end' });
    T(ax, 'серий', { x: X_(5) - 30, y: Y0 - 18 * 17, size: 22, fill: COL.dim });
    const bars = HIST.map((_, k) => mk('rect', { x: X_(k) - 18, y: Y0, width: 36, height: 0, rx: 4, fill: HEADS, opacity: .85 }, ax));
    const cnt = T(p, '', { x: 1470, y: 310, size: 28, fill: COL.chalk, anchor: 'end' });
    prog(q => {
      const t = q * D, n = Math.round(100 * clamp01((t - tm - .5) / 5));
      const h = Array(31).fill(0); for (let i = 0; i < n; i++) h[COUNTS[i]]++;
      h.forEach((v, k) => { bars[k].setAttribute('height', v * U); bars[k].setAttribute('y', Y0 - v * U); });
      cnt.textContent = t > tm ? `серий: ${n}` : '';
    }, 0, D, lin);
    // expected curve 100·P(k, 30)
    let d = '';
    for (let k = 5; k <= 25; k += .25) { const v = 100 * gauss(k - 15, Math.sqrt(7.5)); d += (d ? 'L' : 'M') + X_(k).toFixed(1) + ' ' + (Y0 - v * U).toFixed(1); }
    const curve = path(p, d, { stroke: COL.chalk, 'stroke-width': 3, 'stroke-dasharray': '8 8' }, { d: 0 });
    draw(curve, m('peak', 1.5), 1.5);
    txt(p, 'ожидание: 100 · P(k, 30)', 1470, 380, m('peak', 2), { size: 24, fill: COL.chalk, anchor: 'end' });
    const band = mk('rect', { x: X_(12) - 24, y: 360, width: X_(18) - X_(12) + 48, height: Y0 - 360, fill: COL.good, opacity: 0 }, p);
    tw(band, { o: .1 }, m('peak'), .6);
    txt(p, 'почти все — от 12 до 18', 1470, 440, m('peak', .3), { size: 26, fill: COL.good, anchor: 'end' });
  }],

  ['pascal', 'Треугольник Паскаля', (m) => {
    const p = panel(0);
    head(p, 'Сколькими способами?', .2);
    const t2 = m('two');
    ['ОО', 'ОР', 'РО', 'РР'].forEach((s, i) => {
      const g = G(p, { x: 140 + i * 110, y: 190, o: 0 }); show(g, t2 + i * .3);
      [...s].forEach((c, j) => coinEl(g, c === 'О', { x: j * 34 - 17, r: 15 }));
    });
    txt(p, 'P(2 орла) = 1/4,  P(1 орёл) = 2/4,  P(0) = 1/4', 140, 260, t2 + 1.6, { size: 26, font: MATH });
    const tt = m('tree');
    const X_ = n => 220 + n * 115, Y_ = (n, k) => 470 + (n / 2 - k) * 46;
    for (let n = 0; n <= 6; n++) for (let k = 0; k <= n; k++) {
      const t0 = tt + n * .55;
      if (n < 6) {
        [[n + 1, k + 1, HEADS], [n + 1, k, TAILS]].forEach(([n2, k2, c]) => {
          const e = path(p, `M${X_(n) + 18} ${Y_(n, k)}L${X_(n2) - 18} ${Y_(n2, k2)}`, { stroke: c, 'stroke-width': 2, opacity: .7 }, { d: 0 });
          draw(e, t0 + .2, .35);
        });
      }
      txt(p, String(binom(n, k)), X_(n), Y_(n, k) + 9, t0, { size: 26, anchor: 'middle', font: MATH, fill: n === 6 ? COL.task : COL.chalk });
    }
    T(p, 'орёл ↗   решка ↘', { x: 220, y: 330, size: 22, fill: COL.dim });
    const tf = m('formula');
    eq(p, 'P(k, n) = C(n, k) / 2ⁿ', 1080, 300, tf, { size: 40, fill: COL.task });
    eq(p, 'C(n, k) = n! / (k! (n − k)!)', 1080, 370, tf + 1, { size: 30 });
    eq(p, 'P(3, 6) = 20 / 64 ≈ 0,31', 1080, 450, tf + 2, { size: 30, fill: COL.good });
  }],

  ['q2', 'Быстрая проверка', () => {}, { ask: done => quiz({ x: 1060, y: 520, w: 520, cls: 'side' }, [{
    id: 'c-three', prompt: ['Монету бросили 3 раза. Какова вероятность ровно двух орлов?'],
    build: blanks([{ parts: ['P = ', { box: '3/8' }], why: 'Исходов 2³ = 8; два орла — ООР, ОРО, РОО: 3 способа. P = 3/8.', hint: 'Строка n = 3 треугольника: 1, 3, 3, 1.' }]),
  }], done) }],

  ['walk', 'Случайное блуждание', (m, D) => {
    const p = panel(0);
    head(p, 'Случайное блуждание', .2);
    const X_ = n => 160 + n * 30, Y_ = d => 400 - d * 26;
    const ax = G(p, { o: 0 }); show(ax, m('start'));
    path(ax, `M${X_(0)} ${Y_(0)}H${X_(30) + 20}`, { stroke: COL.dim, 'stroke-width': 2 });
    path(ax, `M${X_(0)} ${Y_(9)}V${Y_(-9)}`, { stroke: COL.dim, 'stroke-width': 2 });
    [-8, -4, 4, 8].forEach(d => T(ax, String(d), { x: X_(0) - 12, y: Y_(d) + 8, size: 20, fill: COL.dim, anchor: 'end', font: MATH }));
    [10, 20, 30].forEach(n => T(ax, String(n), { x: X_(n), y: Y_(-9) + 30, size: 20, fill: COL.dim, anchor: 'middle', font: MATH }));
    T(ax, 'шаги N', { x: X_(30) + 20, y: Y_(0) + 30, size: 20, fill: COL.dim, anchor: 'end' });
    T(ax, 'D', { x: X_(0) - 24, y: Y_(9), size: 24, fill: COL.dim, font: MATH });
    const tp = m('paths');
    const cols = [COL.task, COL.whole, COL.good];
    WALKS.forEach((w, i) => {
      const e = path(p, 'M' + w.map((d, n) => `${X_(n)} ${Y_(d)}`).join('L'), { stroke: cols[i], 'stroke-width': 3 }, { d: 0 });
      draw(e, tp + i * 1.2, 2.5);
    });
    const env = G(p, { o: 0 }); show(env, m('root'));
    let up = '', dn = '';
    for (let n = 0; n <= 30; n++) { up += (up ? 'L' : 'M') + X_(n) + ' ' + Y_(Math.sqrt(n)); dn += (dn ? 'L' : 'M') + X_(n) + ' ' + Y_(-Math.sqrt(n)); }
    path(env, up, { stroke: COL.chalk, 'stroke-width': 2, 'stroke-dasharray': '6 6' }); path(env, dn, { stroke: COL.chalk, 'stroke-width': 2, 'stroke-dasharray': '6 6' });
    T(env, '±√N', { x: X_(30) + 14, y: Y_(Math.sqrt(30)) + 8, size: 24, fill: COL.chalk, font: MATH });
    const td = m('d2');
    eq(p, 'D²ₙ = D²ₙ₋₁ ± 2Dₙ₋₁ + 1', 1140, 220, td, { size: 30 });
    eq(p, '⟨D²ₙ⟩ = ⟨D²ₙ₋₁⟩ + 1', 1140, 290, td + 2, { size: 30, fill: COL.task });
    eq(p, '⟨D²⟩ = N', 1140, 380, m('root'), { size: 40, fill: COL.task });
    eq(p, 'Dск = √N', 1140, 450, m('root', 1), { size: 40, fill: COL.good });
    txt(p, '30 шагов → в среднем ≈ 5,5', 1140, 510, m('root', 2), { size: 26, fill: COL.dim });
  }],

  ['q3', 'Быстрая проверка', () => {}, { ask: done => quiz({ x: 1100, y: 560, w: 460, cls: 'side' }, [{
    id: 'c-walk', prompt: ['Сколько случайных шагов нужно, чтобы уйти в среднем на 10 шагов от начала?'],
    build: blanks([{ parts: ['N = ', { box: '100' }], why: 'Dск = √N = 10 ⇒ N = 100.', hint: 'Типичное расстояние — корень из числа шагов.' }]),
  }], done) }],

  ['honest', 'Честная ли монета', (m, D) => {
    const p = panel(0);
    head(p, 'Доля орлов приближается к 1/2', .2);
    const all = SERIES.flat();
    const X_ = n => 160 + Math.log2(n) / 12 * 1000, Y_ = f => 600 - f * 400;
    const ax = G(p, { o: 0 }); show(ax, .3);
    path(ax, `M${X_(1)} ${Y_(1)}V${Y_(0)}H${X_(4096) + 20}`, { stroke: COL.dim, 'stroke-width': 2 });
    [1, 4, 16, 64, 256, 1024, 3000].forEach(n => T(ax, String(n), { x: X_(n), y: Y_(0) + 30, size: 20, fill: COL.dim, anchor: 'middle', font: MATH }));
    [0, .5, 1].forEach(f => T(ax, String(f).replace('.', ','), { x: X_(1) - 12, y: Y_(f) + 8, size: 20, fill: COL.dim, anchor: 'end', font: MATH }));
    path(ax, `M${X_(1)} ${Y_(.5)}H${X_(4096)}`, { stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 6' });
    T(ax, 'число бросков N (логарифмическая шкала)', { x: X_(4096), y: Y_(0) + 60, size: 20, fill: COL.dim, anchor: 'end' });
    let h = 0, d = '';
    all.forEach((v, i) => { h += v; const n = i + 1; d += (d ? 'L' : 'M') + X_(n).toFixed(1) + ' ' + Y_(h / n).toFixed(1); });
    draw(path(p, d, { stroke: HEADS, 'stroke-width': 3 }, { d: 0 }), m('ratio'), 4);
    const te = m('error');
    let up = '', dn = '';
    for (let n = 4; n <= 3000; n *= 1.2) { up += (up ? 'L' : 'M') + X_(n).toFixed(1) + ' ' + Y_(.5 + 1 / (2 * Math.sqrt(n))).toFixed(1); dn += (dn ? 'L' : 'M') + X_(n).toFixed(1) + ' ' + Y_(.5 - 1 / (2 * Math.sqrt(n))).toFixed(1); }
    const env = G(p, { o: 0 }); show(env, te);
    path(env, up, { stroke: COL.chalk, 'stroke-width': 2, 'stroke-dasharray': '4 6' }); path(env, dn, { stroke: COL.chalk, 'stroke-width': 2, 'stroke-dasharray': '4 6' });
    eq(p, 'P(О) = Nₒ/N ± 1/(2√N)', 1180, 200, te + .5, { size: 32, anchor: 'middle', fill: COL.chalk });
    txt(p, `у нас: ${h} из 3000 = ${(h / 3000).toFixed(3).replace('.', ',')}`, 1180, 260, te + 1.5, { size: 26, fill: HEADS, anchor: 'middle' });
    txt(p, '±2–3 таких «ошибки» — ещё честно', 1180, 320, m('rule'), { size: 26, fill: COL.good, anchor: 'middle' });
  }],

  ['density', 'Плотность вероятности', (m, D) => {
    const p = panel(0);
    head(p, 'Плотность вероятности', .2);
    const X_ = x => 800 + x * .62, Y0 = 640, K = 560 * 100;   // x in step units
    const ax = G(p, { o: 0 }); show(ax, .3);
    path(ax, `M${X_(-1000)} ${Y0}H${X_(1000)}`, { stroke: COL.dim, 'stroke-width': 2 });
    [-800, -400, 0, 400, 800].forEach(x => T(ax, String(x), { x: X_(x), y: Y0 + 30, size: 20, fill: COL.dim, anchor: 'middle', font: MATH }));
    T(ax, 'D', { x: X_(1000), y: Y0 + 30, size: 22, fill: COL.dim, anchor: 'end', font: MATH });
    const curve = N => { let d = ''; for (let x = -1000; x <= 1000; x += 8) d += (d ? 'L' : 'M') + X_(x).toFixed(1) + ' ' + (Y0 - K * gauss(x, Math.sqrt(N))).toFixed(1); return d; };
    const ts = m('dens');
    const c1 = path(p, curve(10000), { stroke: COL.task, 'stroke-width': 3.5 }, { d: 0 }); draw(c1, ts, 1.4);
    txt(p, 'N = 10 000', X_(120), Y0 - K * gauss(0, 100) + 10, ts + 1, { size: 22, fill: COL.task });
    const ta = m('area');
    let a = `M${X_(50)} ${Y0}`;
    for (let x = 50; x <= 150; x += 4) a += `L${X_(x).toFixed(1)} ${(Y0 - K * gauss(x, 100)).toFixed(1)}`;
    const ar = path(p, a + `L${X_(150)} ${Y0}Z`, { fill: COL.task, opacity: .35 }); put(ar, { o: 0 }); show(ar, ta);
    txt(p, 'x₁', X_(50), Y0 + 56, ta, { size: 22, fill: COL.task, anchor: 'middle', font: MATH }); txt(p, 'x₂', X_(150), Y0 + 56, ta, { size: 22, fill: COL.task, anchor: 'middle', font: MATH });
    eq(p, 'P(x₁ < D < x₂) = ∫ p(x) dx', 1160, 200, ta + .5, { size: 30, anchor: 'middle' });
    eq(p, '∫ p(x) dx = 1 (по всей оси)', 1160, 250, ta + 2, { size: 26, anchor: 'middle', fill: COL.dim });
    const tsp = m('spread');
    const c2 = path(p, curve(40000), { stroke: COL.whole, 'stroke-width': 3 }, { d: 0 }); draw(c2, tsp, 1.2);
    const c3 = path(p, curve(160000), { stroke: COL.good, 'stroke-width': 3 }, { d: 0 }); draw(c3, tsp + 1, 1.2);
    txt(p, '40 000', X_(260), Y0 - K * gauss(260, 200) - 10, tsp + .8, { size: 22, fill: COL.whole });
    txt(p, '160 000', X_(560), Y0 - K * gauss(560, 400) - 10, tsp + 1.8, { size: 22, fill: COL.good });
    eq(p, 'p(x) = e^(−x²/2σ²) / (σ√2π),  σ = √N', 1160, 320, tsp + 3, { size: 26, anchor: 'middle', fill: COL.chalk });
  }],

  ['q4', 'Быстрая проверка', () => {}, { ask: done => quiz({ x: 96, y: 120, w: 620, cls: 'side' }, [{
    id: 'c-area', prompt: ['Что означает площадь под кривой плотности между x₁ и x₂?'],
    build: choice([['вероятность того, что D окажется между x₁ и x₂'], ['среднее значение D'], ['значение p(x) в точке x₂']], 0,
      'P(x₁ < D < x₂) = ∫p(x)dx — сумма p(x)·Δx по полоскам между x₁ и x₂.',
      [null, 'Среднее — это центр кривой, а не площадь участка.', 'p(x) — высота кривой; вероятность даёт площадь.']),
  }], done) }],

  ['gas', 'Газ', (m, D) => {
    const p = panel(0);
    head(p, 'Молекулы газа', .2);
    const tp = m('perfume');
    const room = [110, 150, 760, 680];
    mk('rect', { x: room[0], y: room[1], width: room[2] - room[0], height: room[3] - room[1], fill: 'none', stroke: COL.dim, 'stroke-width': 3 }, p);
    const bot = G(p, { x: 170, y: 640 }); mk('rect', { x: -20, y: -50, width: 40, height: 50, rx: 6, fill: COL.rat }, bot); mk('rect', { x: -8, y: -64, width: 16, height: 14, fill: COL.dim }, bot);
    const R = rng(5), mols = Array.from({ length: 70 }, () => ({ el: put(mk('circle', { r: 5, fill: COL.rat }, p), { o: 0 }), t0: tp + R() * 8, seed: R() * 1000 }));
    prog(q => {
      const t = q * D;
      mols.forEach(mo => {
        const s = t - mo.t0;
        if (s < 0) { put(mo.el, { o: 0 }); return; }
        const rr = rng(Math.floor(mo.seed)); let x = 170, y = 580;
        const steps = Math.floor(s * 12);
        for (let k = 0; k < steps; k++) { const a = rr() * 6.283; x = Math.min(room[2] - 8, Math.max(room[0] + 8, x + 18 * Math.cos(a))); y = Math.min(room[3] - 8, Math.max(room[1] + 8, y + 18 * Math.sin(a))); }
        put(mo.el, { x, y, o: 1 });
      });
    }, 0, D, lin);
    const ts = m('speeds');
    const O = [880, 620], W = 600, H = 380;
    const ax = G(p, { o: 0 }); show(ax, ts);
    path(ax, `M${O[0]} ${O[1] - H - 20}V${O[1]}H${O[0] + W + 20}`, { stroke: COL.dim, 'stroke-width': 2 });
    T(ax, 'v', { x: O[0] + W + 20, y: O[1] + 30, size: 26, fill: COL.dim, font: MATH, anchor: 'end' });
    T(ax, 'p(v)', { x: O[0] + 10, y: O[1] - H - 26, size: 24, fill: COL.dim, font: MATH });
    const f = v => v * v * Math.exp(-v * v);   // Maxwell shape, peak at v = 1
    const V = x => x / W * 3.2, F = v => O[1] - H * f(v) / f(1);
    let d = '';
    for (let x = 0; x <= W; x += 4) d += (d ? 'L' : 'M') + (O[0] + x) + ' ' + F(V(x)).toFixed(1);
    draw(path(p, d, { stroke: COL.task, 'stroke-width': 3.5 }, { d: 0 }), ts + .3, 1.5);
    let a = `M${O[0] + 260} ${O[1]}`;
    for (let x = 260; x <= 330; x += 4) a += `L${O[0] + x} ${F(V(x)).toFixed(1)}`;
    const ar = path(p, a + `L${O[0] + 330} ${O[1]}Z`, { fill: COL.task, opacity: .35 }); put(ar, { o: 0 }); show(ar, ts + 2);
    txt(p, 'доля молекул со скоростями от v₁ до v₂', O[0] + 300, O[1] + 60, ts + 2.5, { size: 22, fill: COL.task, anchor: 'middle' });
    txt(p, 'распределение Максвелла', O[0] + W / 2, O[1] - H - 40, ts + 1, { size: 26, fill: COL.chalk, anchor: 'middle' });
  }],

  ['uncert', 'Неопределённость', (m, D) => {
    const p = panel(0);
    head(p, 'Принцип неопределённости', .2);
    const tn = m('narrow');
    const bell = (x0, y0, w, h, c, lab) => { const e = path(p, '', { stroke: c, 'stroke-width': 3.5 }); T(p, lab, { x: x0, y: y0 + 40, size: 24, fill: COL.dim, anchor: 'middle' }); path(p, `M${x0 - 300} ${y0}H${x0 + 300}`, { stroke: COL.dim, 'stroke-width': 2 }); return e; };
    const pe = bell(420, 340, 0, 0, COL.whole, 'положение x'), ve = bell(420, 640, 0, 0, COL.task, 'скорость v');
    const wx = G(p); const wl = T(wx, '', { x: 740, y: 300, size: 28, fill: COL.whole, font: MATH }); const vl = T(wx, '', { x: 740, y: 600, size: 28, fill: COL.task, font: MATH });
    prog(q => {
      const t = q * D, sx = 120 - 95 * smooth(tn, tn + 3, t), sv = 2400 / sx;
      const draw_ = (e, x0, y0, s) => { let d = ''; for (let x = -300; x <= 300; x += 4) d += (d ? 'L' : 'M') + (x0 + x) + ' ' + (y0 - 200 * Math.exp(-x * x / (2 * s * s)) * Math.min(1, 40 / s)).toFixed(1); e.setAttribute('d', d); };
      draw_(pe, 420, 340, sx); draw_(ve, 420, 640, sv);
      wl.textContent = `Δx ~ ${Math.round(sx)}`; vl.textContent = `Δv ~ ${Math.round(sv)}`;
    }, 0, D, lin);
    eq(p, 'Δx · Δv ≥ h / m', 760, 465, m('wide'), { size: 44, fill: COL.chalk });
    const tc = m('cloud');
    const cl = G(p, { x: 1340, y: 250, o: 0 }); show(cl, tc);
    const R = rng(11);
    for (let k = 0; k < 900; k++) { const r = 70 * Math.sqrt(-2 * Math.log(1 - R() * .999)) * .7, a = R() * 6.283; mk('circle', { cx: r * Math.cos(a), cy: r * Math.sin(a), r: 1.6, fill: COL.chalk, opacity: .5 }, cl); }
    mk('circle', { r: 5, fill: COL.bad }, cl);
    txt(p, 'атом водорода: облако вероятностей', 1340, 430, tc + 1, { size: 24, fill: COL.chalk, anchor: 'middle' });
    txt(p, 'радиус ≈ 10⁻¹⁰ м', 1340, 468, tc + 1.5, { size: 24, fill: COL.dim, anchor: 'middle' });
  }],

  ['q5', 'Быстрая проверка', () => {}, { ask: done => quiz({ x: 960, y: 520, w: 600, cls: 'side' }, [{
    id: 'c-heis', prompt: ['Положение электрона измерили вдвое точнее. Что стало с минимальной неопределённостью его скорости?'],
    build: choice([['выросла вдвое'], ['уменьшилась вдвое'], ['не изменилась']], 0,
      'Δx · Δv ≥ h/m: если Δx уменьшить вдвое, Δv не может быть меньше вдвое большего значения.',
      [null, 'Наоборот: точнее положение — хуже скорость.', 'Произведение ограничено снизу — одно нельзя сузить, не расширив другое.']),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    head(p, 'Итоги главы', .2);
    [['Вероятность — ожидаемая доля исходов при повторениях.', 'w1'],
      ['Флуктуации неизбежны: порядка √N для монеты.', 'w2'],
      ['Блуждание уходит на √N шагов; распределение — гауссово.', 'w3'],
      ['В квантовом мире нам даны только вероятности.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 230 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 36, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика 1', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-dice', prompt: ['Бросают два кубика. Какова вероятность получить две шестёрки?'],
    build: blanks([{ parts: ['P = ', { box: '1/36' }], why: '6 · 6 = 36 равноправных исходов, нужный — один.', hint: 'Сколько пар (первый, второй) всего?' }]),
  }, {
    id: 'p-four', prompt: ['Монету бросили 4 раза. Какова вероятность ровно двух орлов?'],
    build: blanks([{ parts: ['P = ', { box: '3/8' }], why: 'C(4, 2) = 6, исходов 2⁴ = 16: 6/16 = 3/8.', hint: 'Строка n = 4 треугольника Паскаля: 1, 4, 6, 4, 1.' }]),
  }, {
    id: 'p-balls', prompt: ['В ящике 7 шаров разного цвета, один из них красный. Берём наугад один. Какова вероятность, что он красный?'],
    build: blanks([{ parts: ['P = ', { box: '1/7' }], why: '7 равноправных исходов, нужный — один.', hint: 'm равноправных исходов → 1/m.' }]),
  }], done, 'Практика по главе   1 из 2') }],

  ['final2', 'Практика 2', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-walk', prompt: ['Молекула делает 10 000 случайных шагов по 10⁻⁷ м. Как далеко она уйдёт в среднем?'],
    build: choice([['≈ 10⁻⁵ м'], ['≈ 10⁻³ м'], ['≈ 10⁻⁷ м'], ['0']], 0,
      'Dск = √N · шаг = 100 · 10⁻⁷ м = 10⁻⁵ м.',
      [null, 'Это N · шаг — так было бы при движении по прямой.', 'Это один шаг; после многих шагов молекула уходит дальше.', 'Средняя координата 0, но среднее квадратичное расстояние — нет.']),
  }, {
    id: 'p-fair', prompt: ['Монету бросили 10 000 раз; орлов выпало 5100. Подозрительно ли это?'],
    build: choice([['да: отклонение 100 — это две «ошибки» по 50; на грани подозрения'], ['нет: отклонение мало, 1 %'], ['да: должно быть ровно 5000']], 0,
      'Ожидаемое отклонение ½√N = 50. 100 — это 2 таких отклонения: случается, но редко (≈ 5 %). Стоит проверить ещё.',
      [null, 'Важна не доля в процентах, а отклонение в единицах ½√N = 50.', 'Ровно 5000 почти никогда не бывает — флуктуации неизбежны.']),
  }, {
    id: 'p-spread', prompt: ['Кривая распределения при N шагов имеет ширину ≈ √N. Во сколько раз уменьшится её высота при увеличении N в 4 раза?'],
    build: blanks([{ parts: ['в ', { box: '2' }, ' раза'], why: 'Ширина растёт как √4 = 2, площадь равна 1 — высота падает вдвое.', hint: 'Площадь под кривой всегда 1.' }]),
  }], done, 'Практика по главе   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
