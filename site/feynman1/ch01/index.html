<script>
'use strict';
const CHAPTER = { number: 1, title: 'Атомы в движении', minutes: 16, language: 'ru', audio: false, next: '../ch02/' };

/* ---------- chapter drawing helpers ---------- */
/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Атомы в движении', (m, D) => {
    const bg = G(scene, { o: 0 });
    const it = gas(bg, 22, [40, 40, 1560, 860], 3, { kinds: ['H2O', 'O2', 'N2', 'CO2'], speed: [30, 70] });
    motion(it, (q, t) => gasAt(q, t, [40, 40, 1560, 860]), 0, D + 1);
    tw(bg, { o: .28 }, 0, 1.2);
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Картина мира · Глава 1', { x: 800, y: 330, size: 30, fill: COL.dim, anchor: 'middle' });
    T(g, 'Атомы в движении', { x: 800, y: 440, size: 92, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = txt(scene, 'Одна фраза, в которой больше всего знаний о мире', 800, 560, m('sub'), { size: 34, fill: COL.task, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8); hide(bg, D - .9, .8);
  }],

  ['approx', 'Законы — приближения', (m) => {
    const p = panel(0);
    head(p, 'Масса тела и его скорость', .2);
    const O = [200, 640], W = 800, H = 150, X_ = b => O[0] + W * b, Y_ = g => O[1] - (g - 1) * H;
    const ax = G(p, { o: 0 }); show(ax, .2);
    path(ax, `M${O[0]} ${Y_(4.2)}V${O[1]}H${X_(1.08)}`, { stroke: COL.dim, 'stroke-width': 3 });
    path(ax, `M${X_(1)} ${O[1] - 280}V${O[1]}`, { stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '8 8' });
    [[0, '0'], [.5, '0,5c'], [1, 'c']].forEach(([b, s]) => T(ax, s, { x: X_(b), y: O[1] + 42, size: 28, fill: COL.dim, anchor: 'middle', font: MATH }));
    [1, 2, 3, 4].forEach(g => T(ax, String(g), { x: O[0] - 22, y: Y_(g) + 10, size: 28, fill: COL.dim, anchor: 'end', font: MATH }));
    italic(T(ax, 'v', { x: X_(1.08) + 14, y: O[1] + 10, size: 32, fill: COL.dim, font: MATH }));
    italic(T(ax, 'm / m₀', { x: O[0] - 20, y: Y_(4.2) - 18, size: 32, fill: COL.dim, font: MATH }));
    const law = path(p, `M${X_(0)} ${Y_(1)}H${X_(1.05)}`, { stroke: COL.whole, 'stroke-width': 6 }, { d: 0 });
    draw(law, m('law'), 1.2);
    txt(p, '«закон»: m = const', X_(.62), Y_(1) - 22, m('law', .8), { size: 30, fill: COL.whole, font: MATH });
    let d = '';
    for (let b = 0; b <= .9682; b += .004) d += (d ? 'L' : 'M') + X_(b).toFixed(1) + ' ' + Y_(1 / Math.sqrt(1 - b * b)).toFixed(1);
    const curve = path(p, d, { stroke: COL.task, 'stroke-width': 6 }, { d: 0 });
    draw(curve, m('curve'), 2.4);
    italic(txt(p, 'm = m₀ / √(1 − v²/c²)', X_(.52), Y_(3.3), m('curve', 1.8), { size: 34, fill: COL.task, font: MATH, anchor: 'end' }));
    // magnifier at v = 100 km/s, practically at the origin
    const lens = G(p, { x: O[0] + 4, y: O[1], s: 0, o: 0 });
    mk('circle', { r: 30, fill: 'none', stroke: COL.chalk, 'stroke-width': 3 }, lens);
    pop(lens, m('zoom'));
    const box = G(p, { o: 0 }); show(box, m('zoom', .5));
    mk('rect', { x: 1080, y: 200, width: 440, height: 300, rx: 18, fill: 'rgba(10,16,14,.55)', stroke: COL.faint, 'stroke-width': 2 }, box);
    path(box, `M${O[0] + 30} ${O[1] - 12}L1080 500`, { stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 8' });
    [['v = 100 км/с', COL.chalk], ['v / c ≈ 0,00033', COL.dim], ['m / m₀ − 1 ≈ 6·10⁻⁸', COL.task], ['прибор этого не заметит', COL.dim]]
      .forEach(([s, c], i) => T(box, s, { x: 1110, y: 262 + i * 66, size: i === 3 ? 28 : 34, fill: c, font: i === 3 ? UI : MATH }));
    txt(p, 'Опыт — единственный судья «истины»', 800, 740, m('judge'), { size: 38, fill: COL.good, anchor: 'middle', weight: 600 });
  }],

  ['sentence', 'Атомная гипотеза', (m, D) => {
    const p = panel(0);
    head(p, 'Если бы от всей науки осталась одна фраза…', .2);
    const lines = ['Все тела состоят из атомов — маленьких телец,', 'которые находятся в беспрерывном движении,',
      'притягиваются на небольшом расстоянии,', 'но отталкиваются, если их плотнее прижать друг к другу.'];
    const Y = [210, 340, 470, 600], SX = 1360;
    lines.forEach((s, i) => {
      const g = G(p, { o: 0, x: -20 });
      T(g, String(i + 1), { x: 96, y: Y[i] + 10, size: 30, fill: COL.task, weight: 700 });
      T(g, s, { x: 140, y: Y[i] + 10, size: 34, weight: 500 });
      tw(g, { o: 1, x: 0 }, m('p' + (i + 1)), .7, out);
    });
    // 1: a cluster of atoms
    const c1 = G(p, { x: SX, y: Y[0], o: 0, s: 1.5 }); show(c1, m('p1', .3));
    [[-30, 0], [0, 0], [30, 0], [-15, -26], [15, -26], [-15, 26], [15, 26]].forEach(([x, y]) => atom(c1, 'C', { x, y, r: 15 }));
    // 2: one atom that never stops
    const c2 = G(p, { x: SX, y: Y[1], o: 0, s: 1.5 }); show(c2, m('p2', .3));
    const a2 = atom(c2, 'C', { r: 15 });
    motion([{ el: a2, x0: 0, y0: 0, ph: 1, w: 9 }], (q, t) => wobble(q, t, 9), 0, D);
    // 3: two atoms at a distance pull together
    const c3 = G(p, { x: SX, y: Y[2], o: 0, s: 1.5 }); show(c3, m('p3', .3));
    const l3 = atom(c3, 'C', { x: -70, r: 15 }), r3 = atom(c3, 'C', { x: 70, r: 15 });
    const v3 = G(c3, { o: 0 }); vec(v3, -48, 0, -14, 0, COL.good, { w: 3, head: 12 }); vec(v3, 48, 0, 14, 0, COL.good, { w: 3, head: 12 });
    show(v3, m('p3', .6));
    tw(l3, { x: -36 }, m('p3', 1.2), 1.4); tw(r3, { x: 36 }, m('p3', 1.2), 1.4); hide(v3, m('p3', 2.4), .4);
    // 4: pressed together, they push apart
    const c4 = G(p, { x: SX, y: Y[3], o: 0, s: 1.5 }); show(c4, m('p4', .3));
    const l4 = atom(c4, 'C', { x: -12, r: 15 }), r4 = atom(c4, 'C', { x: 12, r: 15 });
    const v4 = G(c4, { o: 0 }); vec(v4, -26, 0, -70, 0, COL.bad, { w: 3, head: 12 }); vec(v4, 26, 0, 70, 0, COL.bad, { w: 3, head: 12 });
    show(v4, m('p4', .6));
    tw(l4, { x: -32 }, m('p4', 1.1), .5, out); tw(r4, { x: 32 }, m('p4', 1.1), .5, out);
  }],

  ['q1', 'Быстрая проверка', (m, D) => {
    const p = panel(0);
    const drop = G(p, { x: 430, y: 430, o: 0 }); show(drop, .2);
    path(drop, 'M0 -260C70 -150 220 -40 220 70A220 220 0 0 1 -220 70C-220 -40 -70 -150 0 -260Z', { stroke: WATER, 'stroke-width': 4, fill: 'rgba(134,201,232,.08)' });
    const cg = G(drop);
    const clipId = 'dropclip'; const c = mk('clipPath', { id: clipId }, drop);
    mk('path', { d: 'M0 -256C68 -148 216 -40 216 70A216 216 0 0 1 -216 70C-216 -40 -68 -148 0 -256Z' }, c);
    cg.setAttribute('clip-path', `url(#${clipId})`);
    const it = waterBox(cg, -230, -260, 230, 300, 50, 11);
    motion(it, (q, t) => ({ ...wobble(q, t, 4), r: q.r0 + 18 * Math.sin(q.w * .7 * t + q.ph) }), 0, D + 1);
    T(drop, 'капля воды (увеличена в 10⁹ раз)', { y: 345, size: 26, fill: COL.dim, anchor: 'middle' });
  }, { ask: done => quiz({ x: 800, y: 120, w: 720, cls: 'side' }, [{
    id: 'c-drop', prompt: ['Какая часть атомной гипотезы объясняет, почему капля воды держится и не разлетается на части?'],
    build: choice([['состоят из атомов'], ['находятся в беспрерывном движении'], ['притягиваются на небольшом расстоянии'], ['отталкиваются, если их прижать']], 2,
      'Притяжение соседних молекул удерживает их вместе — поэтому капля сохраняет объём и не растекается.',
      ['Это верно, но само по себе не говорит, что держит атомы вместе.', 'Движение, наоборот, растаскивает молекулы: при нагреве вода испаряется.', null,
        'Отталкивание объясняет, почему каплю трудно сжать, а не почему она держится вместе.']),
  }], done) }],

  ['zoom', 'Капля в миллиард раз', (m, D) => {
    const p = panel(0);
    head(p, 'Увеличиваем каплю воды', .2);
    const CX = [220, 590, 960, 1330], CY = 380, R = 150;
    const frames = CX.map(x => { const g = G(p, { o: 0 }); mk('circle', { cx: x, cy: CY, r: R, fill: 'rgba(10,16,14,.35)', stroke: COL.dim, 'stroke-width': 3 }, g); return g; });
    const clips = CX.map(x => clipCircle(frames[CX.indexOf(x)], x, CY, R - 2));
    // 1: the real drop
    mk('circle', { cx: CX[0], cy: CY, r: 9, fill: WATER }, clips[0]);
    T(frames[0], '0,5 см', { x: CX[0], y: CY + R + 46, size: 30, anchor: 'middle', font: MATH });
    show(frames[0], .2);
    // 2: room-sized, with a paramecium
    mk('rect', { x: CX[1] - R, y: CY - R, width: 2 * R, height: 2 * R, fill: 'rgba(134,201,232,.18)' }, clips[1]);
    const para = G(clips[1], { x: CX[1], y: CY, r: -20 });
    mk('ellipse', { rx: 70, ry: 30, fill: 'rgba(143,214,176,.35)', stroke: COL.irr, 'stroke-width': 3 }, para);
    for (let k = 0; k < 28; k++) { const a = k / 28 * 6.283; path(para, `M${74 * Math.cos(a)} ${33 * Math.sin(a)}l${10 * Math.cos(a)} ${10 * Math.sin(a)}`, { stroke: COL.irr, 'stroke-width': 2 }); }
    mk('circle', { cx: 10, cy: 0, r: 10, fill: COL.irr, opacity: .6 }, para);
    T(frames[1], '10 м · парамеция', { x: CX[1], y: CY + R + 46, size: 30, anchor: 'middle' });
    motion([{ el: para }], (q, t) => ({ x: CX[1] + 30 * Math.sin(t * .6), y: CY + 12 * Math.sin(t * .9), r: -20 + 12 * Math.sin(t * .5) }), 0, D);
    // 3: stadium crowd
    const Rr = rng(5), crowd = [];
    for (let k = 0; k < 420; k++) {
      const x0 = CX[2] - R + Rr() * 2 * R, y0 = CY - R + Rr() * 2 * R;
      crowd.push({ el: put(mk('circle', { r: 3.2, fill: Rr() < .5 ? COL.chalk : COL.bad, opacity: .8 }, clips[2]), { x: x0, y: y0 }), x0, y0, ph: Rr() * 6.28, w: 14 });
    }
    motion(crowd, (q, t) => wobble(q, t, 1.6), 0, D);
    T(frames[2], '20 км · «стадион»', { x: CX[2], y: CY + R + 46, size: 30, anchor: 'middle' });
    // 4: molecules
    const it = waterBox(clips[3], CX[3] - R, CY - R, CX[3] + R, CY + R, 52, 7, .85);
    motion(it, (q, t) => ({ ...wobble(q, t, 4), r: q.r0 + 18 * Math.sin(q.w * .7 * t + q.ph) }), 0, D);
    T(frames[3], '5000 км · молекулы', { x: CX[3], y: CY + R + 46, size: 30, anchor: 'middle' });
    // magnifications
    const K = ['× 2000', '× 2000', '× 250'];
    ['z1', 'z2', 'z3'].forEach((mk_, i) => {
      const a = G(p, { o: 0 });
      vec(a, CX[i] + R - 20, CY - R + 10, CX[i + 1] - R + 20, CY - R + 10, COL.task, { w: 3, head: 14 });
      T(a, K[i], { x: (CX[i] + CX[i + 1]) / 2, y: CY - R - 22, size: 32, fill: COL.task, anchor: 'middle', font: MATH, weight: 600 });
      show(a, m(mk_)); show(frames[i + 1], m(mk_, .4), .8);
    });
    const tot = G(p, { o: 0 });
    T(tot, '2000 · 2000 · 250 = 1 000 000 000 = 10⁹', { x: 800, y: 680, size: 40, fill: COL.task, anchor: 'middle', font: MATH, weight: 600 });
    tw(tot, { o: 1 }, m('total'), .7);
  }],

  ['size', 'Размер атома', (m) => {
    const p = panel(0);
    head(p, 'Насколько мал атом?', .2);
    const r1 = G(p, { o: 0 }); show(r1, .3);
    T(r1, 'радиус атома ≈ (1–2)·10⁻⁸ см', { x: 96, y: 200, size: 40, font: MATH });
    const ang = txt(p, '= 1–2 Å (ангстрема)', 690, 200, m('ang'), { size: 40, fill: COL.task, font: MATH });
    // apple drawing
    const apple = (g, x, y, r) => {
      const a = G(g, { x, y, s: r / 50 });
      path(a, 'M0 -38C-30 -58 -56 -30 -50 2C-44 38 -16 52 0 44C16 52 44 38 50 2C56 -30 30 -58 0 -38Z', { fill: '#e06a5a', stroke: '#a8473c', 'stroke-width': 3 });
      path(a, 'M0 -38C2 -50 6 -58 10 -62', { stroke: '#7a5a3a', 'stroke-width': 4 });
      path(a, 'M8 -52C20 -64 34 -60 38 -54C28 -46 16 -46 8 -52Z', { fill: COL.irr });
      return a;
    };
    const earth = (g, x, y, r) => {
      const e = G(g, { x, y });
      mk('circle', { r, fill: '#3f7fb5', stroke: '#86c9e8', 'stroke-width': 3 }, e);
      path(e, `M${-r * .5} ${-r * .55}C${-r * .1} ${-r * .7} ${r * .1} ${-r * .3} ${-r * .15} ${-r * .05}C${-r * .4} ${r * .2} ${-r * .75} ${0} ${-r * .5} ${-r * .55}Z`, { fill: '#6fae6a' });
      path(e, `M${r * .2} ${r * .1}C${r * .6} ${0} ${r * .7} ${r * .4} ${r * .45} ${r * .65}C${r * .2} ${r * .7} ${r * .05} ${r * .4} ${r * .2} ${r * .1}Z`, { fill: '#6fae6a' });
      return e;
    };
    const rowA = G(p, { o: 0 }), rowB = G(p, { o: 0 });
    atom(rowA, 'C', { x: 330, y: 360, r: 5 });
    vec(rowA, 380, 360, 640, 360, COL.task, { w: 3, head: 14 });
    T(rowA, '× ~10⁸', { x: 510, y: 338, size: 30, fill: COL.task, anchor: 'middle', font: MATH });
    apple(rowA, 760, 360, 62);
    T(rowA, 'атом', { x: 330, y: 432, size: 28, fill: COL.dim, anchor: 'middle' });
    T(rowA, 'яблоко', { x: 760, y: 452, size: 28, fill: COL.dim, anchor: 'middle' });
    apple(rowB, 330, 590, 9);
    vec(rowB, 380, 590, 640, 590, COL.task, { w: 3, head: 14 });
    T(rowB, '× ~10⁸', { x: 510, y: 568, size: 30, fill: COL.task, anchor: 'middle', font: MATH });
    earth(rowB, 820, 590, 125);
    T(rowB, 'яблоко', { x: 330, y: 650, size: 28, fill: COL.dim, anchor: 'middle' });
    T(rowB, 'Земля', { x: 990, y: 700, size: 28, fill: COL.dim, anchor: 'middle' });
    show(rowB, m('apple'), .8); show(rowA, m('apple', 2.2), .8);
    txt(p, 'атом : яблоко ≈ яблоко : Земля', 1060, 380, m('apple', 3.4), { size: 34, fill: COL.chalk, font: MATH });
    txt(p, '8 см · 1,6·10⁸ ≈ 12 700 км', 1060, 440, m('apple', 4), { size: 28, fill: COL.dim, font: MATH });
    txt(p, '(рисунок не в масштабе)', 1060, 490, m('apple', 4), { size: 24, fill: COL.faint });
    return ang;
  }],

  ['water', 'Капля воды', (m, D) => {
    const p = panel(0);
    head(p, 'Вода, увеличенная в миллиард раз', .2);
    const beaker = G(p, { o: 0 }); show(beaker, .2);
    path(beaker, 'M120 150V640Q120 660 140 660H800Q820 660 820 640V150', { stroke: COL.dim, 'stroke-width': 4 });
    const liq = G(beaker);
    const it = waterBox(liq, 132, 250, 808, 650, 50, 21);
    S.water = { it, p, beaker, liq, T0: D };
    motion(it, (q, t) => ({ ...wobble(q, t, 4), r: q.r0 + 20 * Math.sin(q.w * .7 * t + q.ph) }), 0, D);
    // the detail molecule
    const big = G(p, { x: 1210, y: 360, o: 0, s: .2 });
    mol(big, 'H2O', { s: 4.2 });
    tw(big, { o: 1, s: 1 }, m('mol'), .8, back);
    const lab = G(p, { o: 0 }); show(lab, m('mol', .6));
    T(lab, 'O', { x: 1210, y: 300, size: 40, fill: '#1d2b27', anchor: 'middle', weight: 700, font: MATH });
    T(lab, 'H', { x: 1120, y: 420, size: 34, fill: '#1d2b27', anchor: 'middle', weight: 700, font: MATH });
    T(lab, 'H', { x: 1300, y: 420, size: 34, fill: '#1d2b27', anchor: 'middle', weight: 700, font: MATH });
    chem(lab, 'H2O', { x: 1000, y: 260, size: 44, weight: 600 });
    const ang = G(p, { o: 0 }); show(ang, m('angle'));
    const Ox = 1210, Oy = 360 - 6 * 4.2, hx = 21.4 * 4.2, hy = 16.4 * 4.2;
    path(ang, `M${Ox - hx} ${Oy + hy}L${Ox} ${Oy}L${Ox + hx} ${Oy + hy}`, { stroke: COL.board, 'stroke-width': 4, opacity: .8 });
    const ra = 46, ux = hx / Math.hypot(hx, hy), uy = hy / Math.hypot(hx, hy);
    path(ang, `M${Ox - ux * ra} ${Oy + uy * ra}A${ra} ${ra} 0 0 0 ${Ox + ux * ra} ${Oy + uy * ra}`, { stroke: COL.board, 'stroke-width': 4 });
    T(ang, '≈ 105°', { x: Ox, y: Oy + hy + 120, size: 32, fill: COL.task, anchor: 'middle', font: MATH, weight: 600 });
    path(ang, `M${Ox} ${Oy + 54}V${Oy + hy + 88}`, { stroke: COL.task, 'stroke-width': 2, 'stroke-dasharray': '4 6' });
    const nx = uy, ny = -ux, off = 92;   // the bond-length dimension line, outside the molecule
    path(ang, `M${Ox + nx * off} ${Oy + ny * off}L${Ox + hx + nx * off} ${Oy + hy + ny * off}`, { stroke: COL.whole, 'stroke-width': 3 });
    path(ang, `M${Ox} ${Oy}L${Ox + nx * (off + 10)} ${Oy + ny * (off + 10)}M${Ox + hx} ${Oy + hy}L${Ox + hx + nx * (off + 10)} ${Oy + hy + ny * (off + 10)}`, { stroke: COL.whole, 'stroke-width': 1.5, 'stroke-dasharray': '4 6' });
    T(ang, '0,957 Å', { x: Ox + hx / 2 + nx * (off + 22), y: Oy + hy / 2 + ny * (off + 22), size: 30, fill: COL.whole, font: MATH });
    txt(p, 'дрожат · толкаются · держатся вместе', 470, 712, m('jostle'), { size: 30, fill: COL.task, anchor: 'middle' });
    S.water.right = [big, lab, ang];
  }],

  ['heat', 'Теплота и пар', (m, D) => {
    const { it, p, T0 } = S.water;
    S.water.right.forEach(e => hide(e, 0, .5));
    hide(S.panel.lastChild, 0, .4);
    S.panel = p;   // keep the beaker on screen
    const flame = G(p, { o: 0 });
    for (let k = 0; k < 7; k++) path(flame, `M${210 + k * 85} 712C${190 + k * 85} 690 ${222 + k * 85} 676 ${210 + k * 85} 660C${236 + k * 85} 684 ${232 + k * 85} 700 ${210 + k * 85} 712Z`, { fill: COL.task, stroke: COL.nat, 'stroke-width': 2 });
    show(flame, m('heat'));
    const th = m('heat'), ts = m('steam');
    const R = rng(77);
    const fly = it.filter(q => q.y0 < 300).map(q => ({ q, t1: ts + R() * 6, vx: (R() - .5) * 240, vy: -(240 + R() * 160) }));
    const fset = new Map(fly.map(f => [f.q, f]));
    motion(it, (q, t) => {
      const T_ = T0 + t, amp = 4 + 9 * smooth(th, th + 3, t), f = fset.get(q);
      const base = { ...wobble(q, T_, amp), r: q.r0 + (20 + 40 * smooth(th, th + 3, t)) * Math.sin(q.w * .7 * T_ + q.ph) };
      if (!f || t < f.t1) return base;
      const s = t - f.t1;
      return { x: base.x + f.vx * s, y: base.y + f.vy * s, r: base.r + 120 * s, o: clamp01(1 - (110 - (base.y + f.vy * s)) / 60) };
    }, 0, D);
    const tx = G(p);
    txt(tx, 'Теплота = движение молекул', 900, 260, .3, { size: 38, weight: 600 });

    build: blanks([{ parts: ['F′ / F = ', { box: '6' }], why: 'Давление выросло втрое (P ∝ n), а F = P·S — ещё вдвое: 3 · 2 = 6.', hint: 'Сначала найдите, во сколько раз выросло давление, затем умножьте на изменение площади.' }]),
  }], done, 'Практика по главе   1 из 3') }],

  ['final2', 'Практика 2', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-alcohol', prompt: ['Почему капля спирта на коже холодит?'],
    build: choice([['Улетают самые быстрые молекулы, и средняя энергия оставшихся падает'], ['Спирт сам по себе холоднее кожи'], ['Молекулы спирта отнимают тепло у воздуха'], ['В воздухе молекулы спирта замедляются']], 0,
      'Испарение уносит самые энергичные молекулы — оставшаяся жидкость и кожа под ней остывают.',
      [null, 'Даже спирт комнатной температуры холодит — дело в испарении.', 'Воздух тут ни при чём: остывает сама жидкость, потому что её покидают быстрые молекулы.', 'То, что происходит в воздухе, не меняет энергию оставшейся жидкости.']),
  }, {
    id: 'p-compress', prompt: ['Поршень медленно вдвигают в цилиндр с газом. Что происходит с температурой газа?'],
    build: choice([['повышается'], ['не меняется'], ['понижается']], 0,
      'Молекулы отскакивают от наступающего поршня быстрее (v + 2u), средняя скорость растёт — газ нагревается.',
      [null, 'Каждый отскок от движущегося навстречу поршня добавляет молекуле скорость 2u.', 'Понижается температура при расширении, когда поршень уходит.']),
  }, {
    id: 'p-phys-chem', prompt: ['Физический это процесс или химическая реакция?'],
    build: grid([
      { parts: ['лёд тает'], ans: ['ph'], why: 'Физический: молекулы воды остаются теми же, разрушается только порядок.' },
      { parts: ['соль растворяется в воде'], ans: ['ph'], why: 'Физический: ионы Na⁺ и Cl⁻ уходят в воду, но не меняют партнёров по реакции.' },
      { parts: ['уголь горит'], ans: ['ch'], why: 'Химическая реакция: углерод соединяется с кислородом в CO и CO₂.' },
      { parts: ['вода испаряется'], ans: ['ph'], why: 'Физический: молекулы H₂O просто улетают в воздух.' },
      { parts: ['CO соединяется с кислородом в CO₂'], ans: ['ch'], why: 'Химическая реакция: атомы меняют партнёров.' },
    ], [['ph', 'физический', COL.whole, '1'], ['ch', 'химический', COL.task, '2']], { text: true }),
  }], done, 'Практика по главе   2 из 3') }],

  ['final3', 'Практика 3', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-oxygen', prompt: ['Сколько молекул O₂ нужно, чтобы сжечь 4 атома углерода?'],
    build: blanks([
      { parts: ['до углекислого газа: ', { box: '4' }, ' молекулы кислорода'], why: 'C + O₂ → CO₂: на каждый атом углерода — одна молекула O₂.', hint: 'В CO₂ на один атом углерода приходятся два атома кислорода — целая молекула O₂.' },
      { parts: ['до угарного газа: ', { box: '2' }, ' молекулы кислорода'], why: '2C + O₂ → 2CO: одной молекулы O₂ хватает на два атома углерода.', hint: 'В CO на один атом углерода — один атом кислорода, а молекула O₂ содержит два.' },
    ]),
  }, {
    id: 'p-brown', prompt: ['Броуновское движение крупинки в воде вызвано…'],
    build: choice([['неодинаковыми ударами молекул воды с разных сторон'], ['течениями в воде'], ['тем, что крупинка живая'], ['притяжением крупинки к стенкам сосуда']], 0,
      'В каждый момент удары с разных сторон не уравновешиваются — крупинку толкает то туда, то сюда.',
      [null, 'Движение сохраняется и в совершенно спокойной воде, а соседние крупинки движутся независимо.', 'Броун сначала тоже так думал, но так же движутся и частички неживой пыли.', 'Притяжение к стенкам дало бы направленное движение, а не беспорядочное.']),
  }, {
    id: 'p-bigger', prompt: ['Как изменится броуновское движение, если взять крупинку побольше?'],
    build: choice([['станет слабее'], ['станет сильнее'], ['не изменится']], 0,
      'Чем крупнее крупинка, тем больше ударов приходится на неё одновременно и тем лучше они уравновешиваются, а масса растёт — она мечется слабее.',
      [null, 'Ударов станет больше, но они лучше уравновешивают друг друга, а масса крупинки растёт.', 'Дисбаланс ударов и масса зависят от размера крупинки.']),
  }], done, 'Практика по главе   3 из 3') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
