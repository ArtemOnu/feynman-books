<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Алгебра</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render"><!-- hold the first frame until the player exists, so the page transition can run -->
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../lib/atoms.js"></script>
<script src="audio/ru/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 22, title: 'Алгебра', minutes: 14, language: 'ru', audio: false, next: '../ch23/' };

/* ---------- chapter data and helpers ---------- */
const eq = (p, str, x, y, t0, { size = 34, fill = COL.chalk, anchor = 'start' } = {}) => subify(txt(p, str, x, y, t0, { size, fill, anchor, font: MATH }));
const fmt = (v, d) => v.toFixed(d).replace('.', ',');
// Successive square roots of 10 (table 22.1, recomputed).
const ROOTS = Array.from({ length: 11 }, (_, k) => ({ s: 1 / 2 ** k, v: Math.pow(10, 1 / 2 ** k) }));
// Successive squarings of 10^(i/1024) (table 22.3), using the small-step law.
const IM = (() => { let z = [1, 2.3025 / 1024]; const out = [z]; for (let k = 1; k <= 10; k++) { z = [z[0] * z[0] - z[1] * z[1], 2 * z[0] * z[1]]; out.push(z); } return out; })();
function plane(p, C, R, t0) {
  const g = G(p, { o: 0 }); show(g, t0);
  vec(g, C[0] - R - 40, C[1], C[0] + R + 40, C[1], COL.dim, { w: 2, head: 12 }); vec(g, C[0], C[1] + R + 40, C[0], C[1] - R - 40, COL.dim, { w: 2, head: 12 });
  T(g, 'Re', { x: C[0] + R + 30, y: C[1] + 30, size: 22, fill: COL.dim }); T(g, 'Im', { x: C[0] + 12, y: C[1] - R - 30, size: 22, fill: COL.dim });
  mk('circle', { cx: C[0], cy: C[1], r: R, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 6' }, g);
  return g;
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Алгебра', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Колебания · Глава 22', { x: 800, y: 330, size: 30, fill: COL.dim, anchor: 'middle' });
    T(g, 'Алгебра', { x: 800, y: 440, size: 96, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = subify(txt(scene, 'От счёта на пальцах — к e^{iθ} = cos θ + i sin θ', 800, 560, m('sub'), { size: 34, fill: COL.task, anchor: 'middle' }));
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['rules', 'Правила', (m) => {
    const p = panel(0);
    head(p, 'Из счёта — три операции', .2);
    const row = (y, mk_, name, s, c) => { const g = G(p, { o: 0 }); show(g, m(mk_)); T(g, name, { x: 140, y, size: 30, fill: c, weight: 600 }); T(g, s, { x: 480, y, size: 30, fill: COL.chalk, font: MATH }); };
    row(220, 'add', 'сложение', 'a + b: прибавить 1 b раз', COL.whole);
    row(290, 'mul', 'умножение', 'ab: прибавить a b раз', COL.task);
    row(360, 'pow', 'степень', 'aᵇ: умножить на a b раз', COL.good);
    const tl = m('list');
    [['a + b = b + a', 'ab = ba'], ['a(b + c) = ab + ac', '(ab)c = a(bc)'], ['aᵇ aᶜ = aᵇ⁺ᶜ', '(aᵇ)ᶜ = aᵇᶜ'], ['a + 0 = a', 'a · 1 = a']].forEach(([a, b], i) => {
      eq(p, a, 300, 480 + i * 56, tl + i * .5, { size: 30 }); eq(p, b, 860, 480 + i * 56, tl + i * .5 + .2, { size: 30 });
    });
  }],

  ['inverse', 'Обратные операции', (m) => {
    const p = panel(0);
    head(p, 'Прямые и обратные операции', .2);
    const pairs = [['a + b = c', 'b = c − a', 'вычитание'], ['ab = c', 'b = c / a', 'деление'], ['bᵃ = c', 'b = ᵃ√c', 'корень'], ['aᵇ = c', 'b = logₐ c', 'логарифм']];
    pairs.forEach(([a, b, n], i) => {
      const t0 = i < 2 ? m('sub_', i * .6) : m('two', (i - 2) * 1.5), y = 230 + i * 100;
      eq(p, a, 380, y, t0, { size: 36, anchor: 'end' });
      const v = G(p, { o: 0 }); vec(v, 420, y - 12, 560, y - 12, COL.dim, { w: 2, head: 11 }); show(v, t0 + .3);
      eq(p, b, 600, y, t0 + .5, { size: 36, fill: COL.task });
      txt(p, n, 900, y, t0 + .5, { size: 28, fill: COL.dim });
    });
    eq(p, '∛8 = 2,   log₂ 8 = 3', 800, 680, m('two', 4), { size: 36, fill: COL.good, anchor: 'middle' });
  }],

  ['q1', 'Быстрая проверка', () => {}, { ask: done => quiz({ x: 1060, y: 240, w: 500, cls: 'side' }, [{
    id: 'c-inv', prompt: ['В какую степень надо возвести 3, чтобы получить 81?'],
    build: blanks([{ parts: ['log₃ 81 = ', { box: '4' }], why: '3⁴ = 81.', hint: '3 · 3 · 3 · 3 = ?' }]),
  }], done) }],

  ['general', 'Шаг в сторону', (m, D) => {
    const p = panel(0);
    head(p, 'Шаг в сторону и обобщение', .2);
    const X = v => 800 + v * 110, Y = 400;
    path(p, `M${X(-6.5)} ${Y}H${X(6.5)}`, { stroke: COL.dim, 'stroke-width': 3 });
    for (let k = 0; k <= 6; k++) { mk('circle', { cx: X(k), cy: Y, r: 8, fill: COL.chalk }, p); T(p, String(k), { x: X(k), y: Y + 40, size: 24, fill: COL.dim, anchor: 'middle', font: MATH }); }
    const tn = m('neg');
    for (let k = 1; k <= 6; k++) { const d = mk('circle', { cx: X(-k), cy: Y, r: 8, fill: COL.whole }, p); put(d, { o: 0 }); show(d, tn + k * .15); const l = T(p, '−' + k, { x: X(-k), y: Y + 40, size: 24, fill: COL.whole, anchor: 'middle', font: MATH, o: 0 }); show(l, tn + k * .15); }
    eq(p, '3 − 5 = −2', 300, 220, tn + .5, { size: 32, fill: COL.whole });
    const tf = m('frac');
    [.6, 1.5, 2.25, -.4, -1.75, 3.5].forEach((v, i) => { const d = mk('circle', { cx: X(v), cy: Y, r: 6, fill: COL.task }, p); put(d, { o: 0 }); show(d, tf + i * .2); });
    eq(p, '3 / 5', X(.6), Y - 30, tf, { size: 26, fill: COL.task, anchor: 'middle' });
    eq(p, 'a⁻² = 1/a²,   a^{3/5} = ⁵√(a³)', 300, 600, m('power'), { size: 32, fill: COL.good });
    const ti = m('irr');
    const s2 = mk('circle', { cx: X(Math.SQRT2), cy: Y, r: 8, fill: COL.bad }, p); put(s2, { o: 0 }); show(s2, ti);
    eq(p, '√2', X(Math.SQRT2), Y - 30, ti, { size: 28, fill: COL.bad, anchor: 'middle' });
    const dec = T(p, '', { x: 1200, y: 600, size: 32, fill: COL.bad, font: MATH });
    const digits = '1,41421356';
    prog(q => { const t = q * D, n = Math.floor(Math.max(0, t - ti) * 2) + 1; dec.textContent = t > ti ? digits.slice(0, Math.min(digits.length, n + 1)) + '…' : ''; }, 0, D, lin);
  }],

  ['q2', 'Быстрая проверка', () => {}, { ask: done => quiz({ x: 96, y: 640, w: 700, cls: 'side' }, [{
    id: 'c-pow', prompt: ['Чему равно 8 в степени 2/3?'],
    build: blanks([{ parts: ['8', E('2/3'), ' = ', { box: '4' }], why: '∛8 = 2, 2² = 4.', hint: 'a в степени 2/3 = (∛a)².' }]),
  }], done) }],

  ['roots', 'Последовательные корни', (m, D) => {
    const p = panel(0);
    head(p, 'Последовательные квадратные корни из 10', .2);
    const ts = m('sqrt');
    T(p, 's', { x: 260, y: 170, size: 24, fill: COL.dim, anchor: 'end', font: MATH }); T(p, '10ˢ', { x: 500, y: 170, size: 24, fill: COL.dim, anchor: 'end', font: MATH }); T(p, '(10ˢ − 1)/s', { x: 760, y: 170, size: 24, fill: COL.dim, anchor: 'end', font: MATH });
    ROOTS.forEach((r, i) => {
      const y = 210 + i * 44, t0 = ts + i * .45;
      eq(p, i ? `1/${2 ** i}` : '1', 260, y, t0, { size: 26, anchor: 'end' });
      eq(p, fmt(r.v, 5), 500, y, t0 + .1, { size: 26, anchor: 'end', fill: COL.task });
      eq(p, fmt((r.v - 1) / r.s, 4), 760, y, t0 + .2, { size: 26, anchor: 'end', fill: i > 6 ? COL.good : COL.chalk });
    });
    txt(p, 'добавка к 1 почти делится пополам', 880, 300, m('small'), { size: 28, fill: COL.good });
    eq(p, '10^ε ≈ 1 + 2,3026 ε', 880, 420, m('law'), { size: 42, fill: COL.task });
    txt(p, '(у Фейнмана: 2,3025 — точнее 2,302585…)', 880, 470, m('law', 1.5), { size: 20, fill: COL.faint });
  }],

  ['log2', 'Логарифм двух', (m) => {
    const p = panel(0);
    head(p, 'Вычисляем log₁₀ 2', .2);
    const ts = m('split');
    eq(p, '2 = 1,77828 · 1,074607 · 1,036633 · 1,009035 · 1,000573', 800, 240, ts, { size: 32, anchor: 'middle' });
    eq(p, '= 10^{1/4} · 10^{1/32} · 10^{1/64} · 10^{1/256} · 10^{Δ/1024}', 800, 310, ts + 2, { size: 32, anchor: 'middle', fill: COL.whole });
    eq(p, 'log₁₀ 2 = (256 + 32 + 16 + 4 + 0,254)/1024 = 0,30103', 800, 420, m('sum'), { size: 34, anchor: 'middle', fill: COL.task });
    txt(p, 'Бриггс, 1620: 27 корней из 10, по 16 знаков', 800, 560, m('briggs'), { size: 30, anchor: 'middle', fill: COL.good });
  }],

  ['e', 'Число e', (m) => {
    const p = panel(0);
    head(p, 'Натуральное основание', .2);
    eq(p, '10^ε ≈ 1 + 2,3026 ε', 500, 280, .4, { size: 38, anchor: 'middle', fill: COL.dim });
    eq(p, 'e^ε ≈ 1 + ε', 1100, 280, m('natural'), { size: 52, anchor: 'middle', fill: COL.task });
    eq(p, 'e = 10^{1/2,3026} = 2,71828…', 800, 460, m('val'), { size: 44, anchor: 'middle', fill: COL.good });
  }],

  ['q3', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz({ x: 300, y: 160, w: 1000, cls: 'side' }, [{
    id: 'c-log', prompt: ['log₁₀ 2 ≈ 0,301. Чему примерно равен log₁₀ 8?'],
    build: blanks([{ parts: ['≈ ', { box: '0,903' }], test: ([x]) => Math.abs(x - .903) < .002, why: '8 = 2³: 3 · 0,301 = 0,903.', hint: 'log(a³) = 3 log a.' }]),
  }], done) }],

  ['complex', 'Комплексные числа', (m) => {
    const p = panel(0);
    head(p, 'Комплексные числа', .2);
    eq(p, 'x² = −1  ⇒  x = i', 140, 240, .4, { size: 40 });
    const C = [1100, 430], R = 200;
    plane(p, C, R, m('i'));
    const pts = [[1, 0, '1', COL.chalk], [0, 1, 'i', COL.task], [-1, 0, '−1 = i²', COL.whole], [0, -1, '−i = i³', COL.good]];
    pts.forEach(([x, y, s, c], k) => { const g = G(p, { o: 0 }); show(g, m('i', k * .6)); mk('circle', { cx: C[0] + R * x, cy: C[1] - R * y, r: 10, fill: c }, g); T(g, s, { x: C[0] + R * x + (x < 0 ? -18 : 18), y: C[1] - R * y - 16, size: 24, fill: c, font: MATH, anchor: x < 0 ? 'end' : 'start' }); });
    eq(p, 'a = p + iq', 140, 340, m('pq'), { size: 36, fill: COL.task });
    eq(p, '(r + is)(p + iq) = (rp − sq) + i(rq + sp)', 140, 430, m('mul'), { size: 30 });
    txt(p, 'больше изобретать ничего не нужно:', 140, 540, m('enough'), { size: 28, fill: COL.good });
    txt(p, 'любое уравнение решается в комплексных числах', 140, 580, m('enough'), { size: 28, fill: COL.good });
  }],

  ['imag', '10 в мнимой степени', (m, D) => {
    const p = panel(0);
    head(p, '10 в мнимой степени', .2);
    eq(p, '10^{i/1024} ≈ 1 + 0,0022486 i', 140, 220, m('guess'), { size: 32, fill: COL.task });
    const ts = m('square');
    const rows = IM.map((z, k) => eq(p, `i/${1024 / 2 ** k}:  ${fmt(z[0], 5)} ${z[1] < 0 ? '−' : '+'} ${fmt(Math.abs(z[1]), 5)} i`, 140, 290 + k * 38, ts + k * .5, { size: 24, fill: z[0] < 0 ? COL.bad : COL.chalk }));
    const C = [1150, 440], R = 230;
    plane(p, C, R, ts);
    IM.forEach((z, k) => { const d = mk('circle', { cx: C[0] + R * z[0], cy: C[1] - R * z[1], r: 8, fill: COL.task }, p); put(d, { o: 0 }); show(d, ts + k * .5); });
    const tc = m('circle');
    const dots = Array.from({ length: 25 }, (_, k) => { const a = 2.3026 * k / 8, d = mk('circle', { cx: C[0] + R * Math.cos(a), cy: C[1] - R * Math.sin(a), r: 6, fill: COL.good }, p); put(d, { o: 0 }); show(d, tc + k * .12); return d; });
    eq(p, '10^{ip/8}: точки бегут по кругу', C[0], C[1] + R + 70, tc + .5, { size: 26, fill: COL.good, anchor: 'middle' });
  }],

  ['euler', 'Формула Эйлера', (m, D) => {
    const p = panel(0);
    head(p, 'Жемчужина', .2);
    const X0 = 140, Y0 = 320, W = 660, S = 100;
    const ax = G(p, { o: 0 }); show(ax, m('cs'));
    path(ax, `M${X0} ${Y0}H${X0 + W}M${X0} ${Y0 - 120}V${Y0 + 120}`, { stroke: COL.dim, 'stroke-width': 2 });
    let c = '', s = ''; for (let k = 0; k <= 200; k++) { const t = k / 200 * 2 * Math.PI * 1.5; c += (c ? 'L' : 'M') + (X0 + t * W / (3 * Math.PI)).toFixed(1) + ' ' + (Y0 - S * Math.cos(t)).toFixed(1); s += (s ? 'L' : 'M') + (X0 + t * W / (3 * Math.PI)).toFixed(1) + ' ' + (Y0 - S * Math.sin(t)).toFixed(1); }
    draw(path(p, c, { stroke: COL.whole, 'stroke-width': 3 }, { d: 0 }), m('cs', .5), 1.5); draw(path(p, s, { stroke: COL.task, 'stroke-width': 3 }, { d: 0 }), m('cs', 1), 1.5);
    T(p, 'x = cos t', { x: X0 + W + 10, y: Y0 - 60, size: 24, fill: COL.whole, font: MATH }); T(p, 'y = sin t', { x: X0 + W + 10, y: Y0 + 30, size: 24, fill: COL.task, font: MATH });
    eq(p, 'x² + y² = 1,   период 2π', 140, 520, m('same'), { size: 32 });
    eq(p, 'e^{iθ} = cos θ + i sin θ', 800, 650, m('gem'), { size: 52, fill: COL.good, anchor: 'middle' });
    const C = [1260, 360], R = 170;
    plane(p, C, R, m('polar'));
    const v = G(p);
    prog(q => { const t = q * D, a = .9; v.replaceChildren(); if (t < m('polar')) return;
      vec(v, C[0], C[1], C[0] + R * Math.cos(a), C[1] - R * Math.sin(a), COL.task, { w: 4 });
      path(v, `M${C[0] + 60} ${C[1]}A60 60 0 0 0 ${C[0] + 60 * Math.cos(a)} ${C[1] - 60 * Math.sin(a)}`, { stroke: COL.dim, 'stroke-width': 2 });
      T(v, 'θ', { x: C[0] + 70, y: C[1] - 18, size: 26, fill: COL.dim, font: MATH }); T(v, 'r', { x: C[0] + R * .45 * Math.cos(a) - 20, y: C[1] - R * .45 * Math.sin(a) - 10, size: 26, fill: COL.task, font: MATH });
      subify(T(v, 'x + iy = r e^{iθ}', { x: C[0], y: C[1] + R + 60, size: 26, fill: COL.task, font: MATH, anchor: 'middle' })); }, 0, D, lin);
  }],

  ['q4', 'Быстрая проверка', () => {}, { ask: done => quiz({ x: 900, y: 560, w: 660, cls: 'side' }, [{
    id: 'c-euler', prompt: ['Чему равно e в степени iπ?'],
    build: blanks([{ parts: ['e', E('iπ'), ' = ', { box: '-1' }], why: 'cos π + i sin π = −1 + 0i.', hint: 'Подставьте θ = π в формулу Эйлера.' }]),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    head(p, 'Итоги главы', .2);
    [['Сложение, умножение, степень — и обратные к ним.', 'w1'],
      ['Обобщение: новые числа, старые правила.', 'w2'],
      ['Логарифмы — корнями; e^ε ≈ 1 + ε.', 'w3'],
      ['e^{iθ} = cos θ + i sin θ.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 230 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      subify(T(g, str, { x: 260, size: 36, weight: 600 }));
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика 1', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-negpow', prompt: ['Чему равно 2⁻³?'],
    build: blanks([{ parts: ['2⁻³ = ', { box: '1/8' }], why: '1/2³ = 1/8.', hint: 'a⁻ⁿ = 1/aⁿ.' }]),
  }, {
    id: 'p-small', prompt: ['По закону «10 в степени ε ≈ 1 + 2,3026ε» оцените 10 в степени 0,001.'],
    build: blanks([{ parts: ['≈ ', { box: '1,0023' }], test: ([x]) => Math.abs(x - 1.0023) < .0002, why: '1 + 2,3026 · 0,001 ≈ 1,0023.', hint: 'ε = 0,001.' }]),
  }, {
    id: 'p-log5', prompt: ['log₁₀ 2 ≈ 0,301. Найдите log₁₀ 5.'],
    build: blanks([{ parts: ['≈ ', { box: '0,699' }], test: ([x]) => Math.abs(x - .699) < .002, why: '5 = 10/2: 1 − 0,301 = 0,699.', hint: 'log(10/2) = log 10 − log 2.' }]),
  }], done, 'Практика по главе   1 из 2') }],

  ['final2', 'Практика 2', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-mul', prompt: ['(2 + 3i)(1 − i) = ?'],
    build: blanks([{ parts: ['(', { box: '5' }, ') + (', { box: '1' }, ') i'], why: '2 − 2i + 3i − 3i² = 2 + i + 3 = 5 + i.', hint: 'i² = −1.' }]),
  }, {
    id: 'p-abs', prompt: ['Модуль числа 3 + 4i?'],
    build: blanks([{ parts: ['r = ', { box: '5' }], why: '√(9 + 16) = 5.', hint: 'r = √(x² + y²).' }]),
  }, {
    id: 'p-ipow', prompt: ['Чему равно i¹⁰⁰?'],
    build: blanks([{ parts: [{ box: '1' }], why: 'i⁴ = 1, 100 = 4 · 25.', hint: 'Степени i повторяются с периодом 4.' }]),
  }], done, 'Практика по главе   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
