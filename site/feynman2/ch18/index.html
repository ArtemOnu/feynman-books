<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Двумерные вращения</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render"><!-- hold the first frame until the player exists, so the page transition can run -->
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../lib/atoms.js"></script>
<script src="audio/ru/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 18, title: 'Двумерные вращения', minutes: 12, language: 'ru', audio: false, next: '../ch19/' };

/* ---------- chapter drawing helpers ---------- */
const eq = (p, str, x, y, t0, { size = 34, fill = COL.chalk, anchor = 'start' } = {}) => subify(txt(p, str, x, y, t0, { size, fill, anchor, font: MATH }));
function ballEl(p, colr, r, { x = 0, y = 0, o = 1 } = {}) { const g = G(p, { x, y, o }); mk('circle', { r, fill: colr, stroke: COL.board, 'stroke-width': 2 }, g); return g; }
// A dumbbell-like rigid body around its centre of mass: big mass 3 at −40, small mass 1 at +120 (CM at 0).
function body(p) {
  const g = G(p);
  path(g, 'M-40 0H120', { stroke: COL.chalk, 'stroke-width': 6 });
  mk('rect', { x: -70, y: -30, width: 60, height: 60, rx: 6, fill: COL.whole }, g);
  mk('circle', { cx: 120, r: 16, fill: COL.task }, g);
  mk('circle', { r: 7, fill: COL.bad }, g);
  return g;
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Двумерные вращения', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Вращение · Глава 18', { x: 800, y: 330, size: 30, fill: COL.dim, anchor: 'middle' });
    T(g, 'Двумерные вращения', { x: 800, y: 440, size: 92, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = txt(scene, 'От точек — к твёрдым телам', 800, 560, m('sub'), { size: 34, fill: COL.task, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['cm', 'Центр масс', (m, D) => {
    const p = panel(0);
    head(p, 'Центр масс', .2);
    const tt = m('throw'), tp = m('point');
    const b = body(p); put(b, { o: 0 }); show(b, tt);
    const tr = path(p, '', { stroke: COL.bad, 'stroke-width': 3, 'stroke-dasharray': '6 6' }), tr2 = path(p, '', { stroke: COL.task, 'stroke-width': 2, opacity: .7 });
    const P = s => [160 + 270 * s, 640 - 380 * s + 95 * s * s];
    prog(q => {
      const t = q * D, s = Math.max(0, Math.min(3.6, (t - tt) * .3)), [x, y] = P(s), a = s * 260;
      put(b, { x, y, r: a });
      let d = '', d2 = '';
      for (let k = 0; k <= 20 * s; k++) { const ss = k / 20, [xx, yy] = P(ss); d += (d ? 'L' : 'M') + xx.toFixed(1) + ' ' + yy.toFixed(1); const r = ss * 260 * Math.PI / 180; d2 += (d2 ? 'L' : 'M') + (xx + 120 * Math.cos(r)).toFixed(1) + ' ' + (yy + 120 * Math.sin(r)).toFixed(1); }
      tr.setAttribute('d', t > tp ? d : ''); tr2.setAttribute('d', t > tt ? d2 : '');
    }, 0, D, lin);
    txt(p, 'конец стержня — не парабола', 1240, 280, tt + 2, { size: 24, fill: COL.task });
    txt(p, 'центр масс — парабола', 1240, 330, tp + .5, { size: 26, fill: COL.bad, weight: 600 });
    eq(p, 'R = Σ mᵢrᵢ / M', 1240, 430, tp + 2, { size: 36 });
    eq(p, 'F (внеш) = M d²R/dt²', 1240, 500, m('law'), { size: 36, fill: COL.good });
  }],

  ['ship', 'Центр масс на месте', (m, D) => {
    const p = panel(0);
    head(p, 'Без внешних сил центр масс не сдвинется', .2);
    const tw_ = m('walk'), tr = m('rocket');
    const sh = G(p, { x: 600, y: 330 });
    path(sh, 'M-300 -60H220Q330 0 220 60H-300Z', { fill: 'rgba(236,232,220,.06)', stroke: COL.chalk, 'stroke-width': 3 });
    const pp = [0, 1, 2].map(k => { const g = G(sh, { x: -220 + k * 50, y: 10 }); mk('circle', { cy: -30, r: 10, fill: COL.task }, g); path(g, 'M0 -20V20', { stroke: COL.task, 'stroke-width': 5 }); return g; });
    const cm = mk('circle', { cx: 600, cy: 450, r: 9, fill: COL.bad }, p); T(p, 'центр масс', { x: 600, y: 490, size: 22, fill: COL.bad, anchor: 'middle' });
    path(p, 'M600 420V470', { stroke: COL.bad, 'stroke-width': 2, 'stroke-dasharray': '4 4' });
    prog(q => { const t = q * D, f = smooth(tw_, tw_ + 4, t); pp.forEach(g => put(g, { x: -220 + pp.indexOf(g) * 50 + 330 * f })); put(sh, { x: 600 - 40 * f }); }, 0, D, lin);
    const rk = G(p, { x: 1200, y: 600, o: 0 }); show(rk, tr);
    path(rk, 'M-50 -20H40L70 0L40 20H-50Z', { fill: COL.whole });
    const puffs = [0, 1, 2, 3, 4].map(k => mk('circle', { r: 10, fill: COL.task, opacity: .7 }, p));
    prog(q => { const t = q * D, s = Math.min(6, Math.max(0, t - tr)); put(rk, { x: 1200 + 25 * s }); puffs.forEach((pf, k) => { pf.setAttribute('cx', 1140 - 60 * s - k * 22); pf.setAttribute('cy', 600); put(pf, { o: t > tr ? 1 : 0 }); }); }, 0, D, lin);
    mk('circle', { cx: 1200, cy: 660, r: 8, fill: COL.bad }, p);
    T(p, 'газ ← · ракета → · ЦМ на месте', { x: 1200, y: 700, size: 22, fill: COL.dim, anchor: 'middle' });
  }],

  ['q1', 'Быстрая проверка', () => {}, { ask: done => quiz({ x: 96, y: 560, w: 760, cls: 'side' }, [{
    id: 'c-cm', prompt: ['Масса 3 кг в точке x = 0, масса 1 кг в точке x = 4 м. Где центр масс?'],
    build: blanks([{ parts: ['x = ', { box: '1' }, ' м'], why: '(3·0 + 1·4)/4 = 1 м.', hint: 'X = Σmᵢxᵢ / M.' }]),
  }], done) }],

  ['kin', 'Угловая скорость', (m, D) => {
    const p = panel(0);
    head(p, 'Кинематика вращения', .2);
    const O = [480, 440], R = 260;
    const disk = G(p, { x: O[0], y: O[1] });
    mk('circle', { r: R, fill: 'rgba(134,201,232,.08)', stroke: COL.whole, 'stroke-width': 3 }, disk);
    path(disk, `M0 0H${R}`, { stroke: COL.whole, 'stroke-width': 3 });
    mk('circle', { r: 8, fill: COL.chalk }, p).setAttribute('transform', `translate(${O[0]} ${O[1]})`);
    const pts = [[90, COL.good], [180, COL.task], [250, COL.bad]].map(([r, c]) => ({ r, c, el: mk('circle', { r: 10, fill: c }, p), v: G(p) }));
    const th = T(p, '', { x: 900, y: 250, size: 32, fill: COL.whole, font: MATH });
    const w = .6;
    prog(q => {
      const t = q * D, a = w * t;
      put(disk, { r: -a * 180 / Math.PI });
      th.textContent = t > m('angle') ? `θ = ${(a % 6.283).toFixed(1).replace('.', ',')} рад` : '';
      pts.forEach(pt => { const x = O[0] + pt.r * Math.cos(a), y = O[1] - pt.r * Math.sin(a); pt.el.setAttribute('cx', x); pt.el.setAttribute('cy', y);
        pt.v.replaceChildren(); if (t > m('v')) vec(pt.v, x, y, x - .45 * pt.r * Math.sin(a), y - .45 * pt.r * Math.cos(a), pt.c, { w: 3, head: 11 }); });
    }, 0, D, lin);
    eq(p, 'ω = dθ/dt', 900, 340, m('omega'), { size: 38 });
    eq(p, 'v = ω r', 900, 430, m('v'), { size: 44, fill: COL.task });
    eq(p, 'α = dω/dt', 900, 520, m('alpha'), { size: 38, fill: COL.dim });
  }],

  ['torque', 'Момент силы', (m, D) => {
    const p = panel(0);
    head(p, 'Момент силы', .2);
    eq(p, 'ΔW = τ Δθ', 1000, 220, m('work'), { size: 38 });
    eq(p, 'τ = x F_y − y F_x', 1000, 300, m('tau'), { size: 38, fill: COL.task });
    eq(p, 'τ = F · плечо', 1000, 380, m('arm'), { size: 38, fill: COL.good });
    const H = [200, 500], L = 520;
    const td = m('door');
    const door = G(p, { x: H[0], y: H[1] });
    mk('rect', { x: 0, y: -16, width: L, height: 32, rx: 4, fill: '#a8805a' }, door);
    mk('circle', { cx: L - 40, r: 10, fill: COL.int }, door);
    mk('circle', { cx: H[0], cy: H[1], r: 12, fill: COL.dim }, p);
    T(p, 'петли', { x: H[0], y: H[1] + 50, size: 22, fill: COL.dim, anchor: 'middle' });
    const f1 = G(p, { o: 0 }), f2 = G(p, { o: 0 });
    vec(f1, H[0] + 60, H[1] + 120, H[0] + 60, H[1] + 24, COL.bad, { w: 4 }); T(f1, 'у петель — трудно', { x: H[0] + 80, y: H[1] + 110, size: 22, fill: COL.bad });
    vec(f2, H[0] + L - 40, H[1] + 120, H[0] + L - 40, H[1] + 24, COL.good, { w: 4 }); T(f2, 'у ручки — легко', { x: H[0] + L - 20, y: H[1] + 110, size: 22, fill: COL.good });
    show(f1, td); show(f2, td + 1.5);
    prog(q => { const t = q * D; put(door, { r: -(t < td + 1.5 ? 2 * smooth(td, td + 1.5, t) : 2 + 28 * smooth(td + 1.5, td + 4, t)) }); }, 0, D, lin);
    const tr = m('radial');
    const rf = G(p, { o: 0 }); show(rf, tr);
    vec(rf, H[0] + 600, H[1] - 60, H[0] + 380, H[1] - 30, COL.dim, { w: 3 }); T(rf, 'к оси — не крутит', { x: H[0] + 560, y: H[1] - 90, size: 22, fill: COL.dim });
  }],

  ['q2', 'Быстрая проверка', () => {}, { ask: done => quiz({ x: 1000, y: 470, w: 560, cls: 'side' }, [{
    id: 'c-tau', prompt: ['Гаечный ключ длиной 0,3 м, сила 40 Н перпендикулярно ключу. Момент силы?'],
    build: blanks([{ parts: ['τ = ', { box: '12' }, ' Н·м'], why: '40 · 0,3 = 12 Н·м.', hint: 'τ = F · плечо.' }]),
  }], done) }],

  ['balance', 'Равновесие', (m, D) => {
    const p = panel(0);
    head(p, 'Равновесие', .2);
    eq(p, 'Σ F = 0   и   Σ τ = 0', 800, 220, m('cond'), { size: 42, anchor: 'middle', fill: COL.task });
    const tl = m('lever');
    const lev = G(p, { x: 800, y: 480, o: 0 }); show(lev, tl);
    path(lev, 'M-460 0H460', { stroke: COL.chalk, 'stroke-width': 8 });
    mk('path', { d: 'M0 4l-30 60h60z', fill: COL.task }, lev);
    const w = (x, s, lab) => { mk('rect', { x: x - s / 2, y: -s - 4, width: s, height: s, rx: 6, fill: '#55665f', stroke: COL.dim, 'stroke-width': 2 }, lev); T(lev, lab, { x, y: -s / 2 + 4, size: 22, fill: COL.chalk, anchor: 'middle' }); };
    w(-200, 80, '2 кг'); w(400, 60, '1 кг');
    T(lev, '1 м', { x: -100, y: 40, size: 22, fill: COL.dim, anchor: 'middle' }); T(lev, '2 м', { x: 200, y: 40, size: 22, fill: COL.dim, anchor: 'middle' });
    prog(q => { const t = q * D; put(lev, { r: 6 * Math.exp(-(t - tl)) * Math.cos(4 * (t - tl)) * (t > tl ? 1 : 0) }); }, 0, D, lin);
    eq(p, '2 кг · 1 м = 1 кг · 2 м', 800, 640, tl + 1.5, { size: 34, anchor: 'middle', fill: COL.good });
  }],

  ['L', 'Момент количества движения', (m, D) => {
    const p = panel(0);
    head(p, 'Момент количества движения', .2);
    eq(p, 'L = x p_y − y p_x = p · плечо', 1050, 220, m('def'), { size: 32 });
    eq(p, 'τ = dL/dt', 1050, 300, m('rate'), { size: 40, fill: COL.task });
    const S = [660, 450], a = 300, e = .6, b = a * Math.sqrt(1 - e * e), c = a * e, C = [S[0] - c, S[1]];
    path(p, `M${C[0] - a} ${C[1]}a${a} ${b} 0 1 0 ${2 * a} 0a${a} ${b} 0 1 0 ${-2 * a} 0`, { stroke: COL.faint, 'stroke-width': 2 });
    mk('circle', { cx: S[0], cy: S[1], r: 20, fill: COL.int }, p);
    const pos = M => { let E = M; for (let k = 0; k < 10; k++) E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E)); return [C[0] + a * Math.cos(E), C[1] - b * Math.sin(E)]; };
    const tk = m('kepler');
    const pl = ballEl(p, COL.whole, 12);
    const sects = [0, 2.2, 4.2].map(M0 => { let d = `M${S[0]} ${S[1]}`; for (let k = 0; k <= 16; k++) { const [x, y] = pos(M0 + .5 * k / 16); d += `L${x.toFixed(1)} ${y.toFixed(1)}`; } const e_ = path(p, d + 'Z', { fill: COL.task, opacity: .3 }); put(e_, { o: 0 }); return e_; });
    sects.forEach((s, i) => show(s, tk + 1 + i));
    prog(q => { const t = q * D, [x, y] = pos(t * .7); put(pl, { x, y }); }, 0, D, lin);
    txt(p, 'сила к Солнцу → τ = 0 → L = const', 1050, 400, tk, { size: 26, fill: COL.good });
    txt(p, 'равные площади за равные времена', 1050, 450, tk + 2, { size: 26, fill: COL.task });
  }],

  ['conserve', 'Сохранение L', (m) => {
    const p = panel(0);
    head(p, 'Система частиц и твёрдое тело', .2);
    eq(p, 'dL/dt = τ (внеш)', 800, 220, m('theorem'), { size: 42, anchor: 'middle', fill: COL.task });
    eq(p, 'τ (внеш) = 0  ⇒  L = const', 800, 300, m('law'), { size: 38, anchor: 'middle', fill: COL.good });
    eq(p, 'L = I ω,   I = Σ mᵢ rᵢ²', 800, 420, m('rigid'), { size: 44, anchor: 'middle' });
    const tab = G(p, { o: 0 }); show(tab, m('rigid', 2));
    [['p = m v', 'L = I ω'], ['F = dp/dt', 'τ = dL/dt'], ['m', 'I'], ['v', 'ω']].forEach(([a, b], i) => {
      T(tab, a, { x: 640, y: 520 + i * 48, size: 30, fill: COL.dim, anchor: 'end', font: MATH }); T(tab, '↔', { x: 800, y: 520 + i * 48, size: 30, fill: COL.dim, anchor: 'middle' }); T(tab, b, { x: 960, y: 520 + i * 48, size: 30, fill: COL.task, font: MATH });
    });
  }],

  ['inertia', 'Момент инерции', (m, D) => {
    const p = panel(0);
    head(p, 'Инерция вращения зависит от расстояния масс до оси', .2);
    const O = [800, 360];
    const rod = G(p, { x: O[0], y: O[1] });
    path(rod, 'M-280 0H280', { stroke: COL.chalk, 'stroke-width': 6 });
    const m1 = mk('circle', { r: 22, fill: COL.whole }, rod), m2 = mk('circle', { r: 22, fill: COL.whole }, rod);
    mk('circle', { cx: O[0], cy: O[1], r: 30, fill: 'none', stroke: COL.dim, 'stroke-width': 4 }, p);
    const str = path(p, '', { stroke: COL.dim, 'stroke-width': 2 }), wt = G(p); mk('rect', { x: -20, y: 0, width: 40, height: 40, fill: '#55665f' }, wt); T(wt, 'M', { y: 28, size: 22, fill: COL.chalk, anchor: 'middle' });
    const tn = m('near'), tf = m('far');
    prog(q => {
      const t = q * D, far = t >= tf, r = far ? 250 : 60, I = 1 + (r / 60) ** 2 * 2, s = far ? t - tf : Math.max(0, t - tn);
      const ang = 1.2 * s * s / I, h = Math.min(260, 30 * ang);
      [m1, m2].forEach((e, k) => e.setAttribute('cx', k ? r : -r)); put(rod, { r: ang * 57 });
      str.setAttribute('d', `M${O[0] + 30} ${O[1]}V${O[1] + 60 + h}`); put(wt, { x: O[0] + 30, y: O[1] + 60 + h });
    }, 0, D, lin);
    txt(p, 'массы у оси — быстро', 300, 600, tn + .5, { size: 26, fill: COL.good });
    txt(p, 'массы у концов — медленно', 1100, 600, tf + .5, { size: 26, fill: COL.bad });
  }],

  ['q3', 'Быстрая проверка', () => {}, { ask: done => quiz({ x: 300, y: 640, w: 1000, cls: 'side' }, [{
    id: 'c-I', prompt: ['Две массы по 1 кг на расстоянии 0,5 м от оси (по разные стороны). Момент инерции?'],
    build: blanks([{ parts: ['I = ', { box: '0,5' }, ' кг·м²'], why: '2 · 1 · 0,5² = 0,5 кг·м².', hint: 'I = Σ m r².' }]),
  }], done) }],

  ['skater', 'Фигуристка', (m, D) => {
    const p = panel(0);
    head(p, 'Прижать руки — закрутиться быстрее', .2);
    const C = [500, 420];
    const man = G(p, { x: C[0], y: C[1] });
    mk('circle', { r: 36, fill: COL.task }, man);
    const armL = path(man, '', { stroke: COL.task, 'stroke-width': 8 }), armR = path(man, '', { stroke: COL.task, 'stroke-width': 8 });
    const dL = mk('circle', { r: 18, fill: '#55665f' }, man), dR = mk('circle', { r: 18, fill: '#55665f' }, man);
    T(p, 'вид сверху', { x: C[0], y: C[1] + 260, size: 22, fill: COL.dim, anchor: 'middle' });
    const tp = m('pull');
    const rd = T(p, '', { x: 900, y: 360, size: 32, fill: COL.whole, font: MATH });
    let ang = 0, last = 0;
    prog(q => {
      const t = q * D, r = 200 - 140 * smooth(tp, tp + 2, t), I = 1 + 2 * (r / 100) ** 2, w = 9 / I;
      const a = 1.0 * t + 0;   // replaced below by integral
      const A = (() => { let s = 0, dt = .05; for (let u = 0; u < t; u += dt) { const rr = 200 - 140 * smooth(tp, tp + 2, u); s += 9 / (1 + 2 * (rr / 100) ** 2) * dt; } return s; })();
      put(man, { r: A * 57 });
      armL.setAttribute('d', `M-30 0H${-r}`); armR.setAttribute('d', `M30 0H${r}`); dL.setAttribute('cx', -r); dR.setAttribute('cx', r);
      rd.textContent = `I ω = ${I.toFixed(1).replace('.', ',')} × ${w.toFixed(2).replace('.', ',')} = 9`;
    }, 0, D, lin);
    eq(p, 'I₁ω₁ = I₂ω₂', 900, 260, m('arms'), { size: 44, fill: COL.task });
    txt(p, 'I уменьшилось — ω выросла', 900, 450, m('fast'), { size: 28, fill: COL.good });
  }],

  ['q4', 'Быстрая проверка', () => {}, { ask: done => quiz({ x: 880, y: 520, w: 680, cls: 'side' }, [{
    id: 'c-skate', prompt: ['Фигуристка уменьшила момент инерции втрое. Как изменилась угловая скорость?'],
    build: blanks([{ parts: ['выросла в ', { box: '3' }, ' раза'], why: 'Iω = const: ω₂ = 3ω₁.', hint: 'Момент количества движения сохраняется.' }]),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    head(p, 'Итоги главы', .2);
    [['Центр масс движется как точка с массой M.', 'w1'],
      ['Вращение: θ, ω = dθ/dt, v = ωr.', 'w2'],
      ['τ = F · плечо = dL/dt.', 'w3'],
      ['Без внешних моментов L = Iω сохраняется.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 230 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 36, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика 1', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-lever', prompt: ['На рычаге груз 6 кг в 0,5 м от опоры. На каком расстоянии с другой стороны уравновесит груз 2 кг?'],
    build: blanks([{ parts: [{ box: '1,5' }, ' м'], why: '6 · 0,5 = 2 · x ⇒ x = 1,5 м.', hint: 'Σ τ = 0.' }]),
  }, {
    id: 'p-v', prompt: ['Колесо радиусом 0,4 м вращается с ω = 10 рад/с. Скорость точки обода?'],
    build: blanks([{ parts: ['v = ', { box: '4' }, ' м/с'], why: 'v = ωr = 10 · 0,4 = 4 м/с.', hint: 'v = ωr.' }]),
  }, {
    id: 'p-cm2', prompt: ['Человек 80 кг прошёл 5 м к корме лодки 120 кг на гладкой воде. На сколько сдвинулась лодка?'],
    build: blanks([{ parts: [{ box: '2' }, ' м'], why: 'Центр масс неподвижен: 80·(5 − s) = 120·s ⇒ s = 2 м.', hint: 'Относительно воды человек сдвинулся на 5 − s.' }]),
  }], done, 'Практика по главе   1 из 2') }],

  ['final2', 'Практика 2', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-orbit', prompt: ['Комета в перигелии на расстоянии 1 а.е. летит со скоростью 40 км/с. Какова её скорость в афелии на 20 а.е.?'],
    build: blanks([{ parts: ['v = ', { box: '2' }, ' км/с'], why: 'L = mvr сохраняется (в этих точках v ⟂ r): 40 · 1 = v · 20 ⇒ v = 2 км/с.', hint: 'v₁r₁ = v₂r₂.' }]),
  }, {
    id: 'p-cat', prompt: ['Почему кошка, падая, успевает перевернуться, хотя её L ≈ 0?'],
    build: choice([['меняя момент инерции частей тела, она поворачивает их по очереди'], ['она отталкивается от воздуха'], ['закон сохранения момента для животных не действует']], 0,
      'Части тела поворачиваются в разные стороны с разными I: полный L остаётся нулевым, но ориентация меняется.',
      [null, 'Сопротивление воздуха здесь ничтожно.', 'Закон действует всегда.']),
  }], done, 'Практика по главе   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
