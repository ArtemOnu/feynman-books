<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Переходные решения</title>

<body>
<script src="../lib/engine.js"></script>
<script src="../lib/atoms.js"></script>
<script src="audio/ru/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 24, title: 'Переходные решения', minutes: 12, language: 'ru', audio: false, next: '../ch25/' };

/* ---------- chapter drawing helpers ---------- */
const eq = (p, str, x, y, t0, { size = 34, fill = COL.chalk, anchor = 'start' } = {}) => subify(txt(p, str, x, y, t0, { size, fill, anchor, font: MATH }));
function axesT(p, x0, y0, w, h, t0, lab = 'x') {
  const g = G(p, { o: 0 }); show(g, t0);
  path(g, `M${x0} ${y0 - h}V${y0 + h}M${x0} ${y0}H${x0 + w + 20}`, { stroke: COL.dim, 'stroke-width': 2 });
  T(g, 't', { x: x0 + w + 24, y: y0 + 8, size: 24, fill: COL.dim, font: MATH }); T(g, lab, { x: x0 + 10, y: y0 - h - 6, size: 24, fill: COL.dim, font: MATH });
  return g;
}
// x(t) for the damped oscillator with ω₀ = 1, x(0) = 1, v(0) = 0 (under-, critically and over-damped).
function damped(t, g) {
  const h = g / 2;
  if (h < 1 - 1e-6) { const w = Math.sqrt(1 - h * h); return Math.exp(-h * t) * (Math.cos(w * t) + h / w * Math.sin(w * t)); }
  if (h > 1 + 1e-6) { const s = Math.sqrt(h * h - 1), r1 = -h + s, r2 = -h - s, A = r2 / (r2 - r1), B = 1 - A; return A * Math.exp(r1 * t) + B * Math.exp(r2 * t); }
  return Math.exp(-t) * (1 + t);
}
const curve = (fn, x0, y0, sx, sy, t1, n = 300) => { let d = ''; for (let k = 0; k <= n; k++) { const t = t1 * k / n; d += (d ? 'L' : 'M') + (x0 + t * sx).toFixed(1) + ' ' + (y0 - sy * fn(t)).toFixed(1); } return d; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Переходные решения', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Колебания · Глава 24', { x: 800, y: 330, size: 30, fill: COL.dim, anchor: 'middle' });
    T(g, 'Переходные решения', { x: 800, y: 440, size: 92, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = txt(scene, 'Что происходит, когда сила выключена', 800, 560, m('sub'), { size: 34, fill: COL.task, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['square', 'Средний квадрат', (m) => {
    const p = panel(0);
    head(p, 'Энергия и комплексные числа', .2);
    eq(p, 'A = Re(Â e^{iωt}) = A₀ cos(ωt + Δ)', 800, 220, m('trap'), { size: 34, anchor: 'middle' });
    txt(p, '(Â e^{iωt})² ≠ (Re …)² — квадрат берём у действительной части', 800, 280, m('trap', 1.5), { size: 26, anchor: 'middle', fill: COL.bad });
    const ta = m('avg');
    axesT(p, 200, 580, 1100, 150, ta, 'A²');
    draw(path(p, curve(t => Math.cos(t) ** 2, 200, 580, 70, 140, 15.7), { stroke: COL.task, 'stroke-width': 3 }, { d: 0 }), ta + .3, 1.5);
    const half = path(p, 'M200 510H1310', { stroke: COL.good, 'stroke-width': 2, 'stroke-dasharray': '8 8' }); put(half, { o: 0 }); show(half, ta + 1.8);
    eq(p, '⟨A²⟩ = ½ A₀²', 1320, 500, ta + 2, { size: 32, fill: COL.good });
  }],

  ['power', 'Мощность', (m) => {
    const p = panel(0);
    head(p, 'Куда уходит работа силы', .2);
    eq(p, 'P = F ẋ = d/dt [½ m ẋ² + ½ m ω₀² x²] + γ m ẋ²', 800, 230, m('p'), { size: 34, anchor: 'middle' });
    eq(p, '⟨P⟩ = ½ γ m ω² x₀²', 800, 360, m('avgP'), { size: 44, anchor: 'middle', fill: COL.task });
    txt(p, 'запас в среднем не меняется — всё поглощает трение', 800, 420, m('avgP', 1), { size: 26, anchor: 'middle', fill: COL.dim });
    eq(p, '⟨P⟩ = R ⟨I²⟩ = ½ R I₀²', 800, 540, m('joule'), { size: 40, anchor: 'middle', fill: COL.bad });
    txt(p, 'джоулево тепло', 800, 600, m('joule', 1), { size: 26, anchor: 'middle', fill: COL.bad });
  }],

  ['q', 'Добротность', (m) => {
    const p = panel(0);
    head(p, 'Добротность', .2);
    eq(p, 'Q = 2π · (запасённая энергия) / (работа за цикл)', 800, 260, m('def'), { size: 36, anchor: 'middle', fill: COL.task });
    eq(p, 'Q = (ω² + ω₀²)/2γω  →  ω₀/γ  при ω ≈ ω₀', 800, 380, m('res'), { size: 36, anchor: 'middle' });
    txt(p, 'большое Q: энергии много, потерь за цикл мало', 800, 500, m('good'), { size: 30, anchor: 'middle', fill: COL.good });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz({ x: 300, y: 160, w: 1000, cls: 'side' }, [{
    id: 'c-avg', prompt: ['Ток в цепи I = 2 cos ωt (А), сопротивление 10 Ом. Средняя мощность тепла?'],
    build: blanks([{ parts: ['⟨P⟩ = ', { box: '20' }, ' Вт'], why: '½ R I₀² = ½ · 10 · 4 = 20 Вт.', hint: '⟨cos²⟩ = ½.' }]),
  }], done) }],

  ['decay', 'Затухание', (m) => {
    const p = panel(0);
    head(p, 'Сила выключена', .2);
    eq(p, 'dE/dt = −ω₀E/Q  ⇒  E = E₀ e^{−γt}', 800, 200, m('loss'), { size: 34, anchor: 'middle' });
    eq(p, 'x = A₀ e^{−γt/2} cos ω₀t', 800, 260, m('amp'), { size: 36, anchor: 'middle', fill: COL.task });
    const tc = m('curve'), g = .25;
    axesT(p, 160, 520, 1200, 200, tc);
    const env = G(p, { o: 0 }); show(env, tc);
    path(env, curve(t => Math.exp(-g * t / 2), 160, 520, 40, 190, 30), { stroke: COL.dim, 'stroke-width': 2, 'stroke-dasharray': '8 8' });
    path(env, curve(t => -Math.exp(-g * t / 2), 160, 520, 40, 190, 30), { stroke: COL.dim, 'stroke-width': 2, 'stroke-dasharray': '8 8' });
    T(env, 'e^{−γt/2}', { x: 260, y: 330, size: 24, fill: COL.dim, font: MATH }); subify(env.lastChild);
    draw(path(p, curve(t => damped(t, g), 160, 520, 40, 190, 30), { stroke: COL.task, 'stroke-width': 3.5 }, { d: 0 }), tc + .3, 3);
  }],

  ['exact', 'Точное решение', (m) => {
    const p = panel(0);
    head(p, 'Точное решение', .2);
    eq(p, 'x = A e^{iαt}', 800, 220, m('try'), { size: 40, anchor: 'middle' });
    eq(p, '−α² + iγα + ω₀² = 0', 800, 310, m('eq'), { size: 40, anchor: 'middle', fill: COL.task });
    eq(p, 'α = iγ/2 ± ωᵧ,   ωᵧ = √(ω₀² − γ²/4)', 800, 400, m('roots'), { size: 38, anchor: 'middle' });
    eq(p, 'x = A e^{−γt/2} cos ωᵧ t', 800, 520, m('sol'), { size: 46, anchor: 'middle', fill: COL.good });
    txt(p, 'частота ωᵧ чуть меньше ω₀', 800, 590, m('sol', 1.5), { size: 26, anchor: 'middle', fill: COL.dim }); subify(p.lastChild);
  }],

  ['q2', 'Быстрая проверка', () => {}, { ask: done => quiz({ x: 300, y: 620, w: 1000, cls: 'side' }, [{
    id: 'c-decay', prompt: ['Энергия осциллятора за 10 с уменьшилась в e раз. Во сколько раз за это время уменьшилась амплитуда?'],
    build: choice([['в √e ≈ 1,65 раза'], ['в e раз'], ['в e² раз']], 0, 'Энергия ∝ амплитуде²: амплитуда убывает как e^{−γt/2}.', [null, 'Энергия — квадрат амплитуды.', 'Наоборот: амплитуда убывает медленнее энергии.']),
  }], done) }],

  ['two', 'Два решения', (m) => {
    const p = panel(0);
    head(p, 'Зачем второе решение', .2);
    eq(p, 'x₁ = A e^{−γt/2} e^{iωᵧt},   x₂ = B e^{−γt/2} e^{−iωᵧt}', 800, 240, m('real'), { size: 34, anchor: 'middle' });
    eq(p, 'B = A*  ⇒  x = e^{−γt/2}(A e^{iωᵧt} + A* e^{−iωᵧt}) — действительно', 800, 340, m('conj'), { size: 30, anchor: 'middle', fill: COL.task });
    txt(p, 'A (две действительные постоянные) — из x₀ и v₀', 800, 430, m('conj', 2), { size: 28, anchor: 'middle', fill: COL.good });
  }],

  ['circuit', 'Переходные колебания в цепи', (m, D) => {
    const p = panel(0);
    head(p, 'Осциллограф: увеличиваем сопротивление', .2);
    const gs = [[.15, 'switch', COL.task, 'малое R'], [.6, 'more', COL.whole, 'больше R'], [1.6, 'crit', COL.good, 'ещё больше'], [3.2, 'over', COL.rat, 'γ/2 > ω₀: колебаний нет']];
    gs.forEach(([g, mk_, c, s], i) => {
      const x0 = 140 + (i % 2) * 700, y0 = 300 + Math.floor(i / 2) * 260;
      const sc = G(p, { o: 0 }); show(sc, m(mk_));
      mk('rect', { x: x0 - 20, y: y0 - 120, width: 640, height: 220, rx: 12, fill: '#0b1310', stroke: COL.faint, 'stroke-width': 2 }, sc);
      path(sc, `M${x0} ${y0}H${x0 + 600}`, { stroke: '#1e2d27', 'stroke-width': 1 });
      draw(path(p, curve(t => damped(t, g), x0, y0, 20, 95, 30), { stroke: c, 'stroke-width': 3 }, { d: 0 }), m(mk_, .2), 1.5);
      txt(p, s, x0 + 300, y0 + 130, m(mk_, .2), { size: 24, fill: c, anchor: 'middle' });
    });
  }],

  ['q3', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz({ x: 300, y: 160, w: 1000, cls: 'side' }, [{
    id: 'c-over', prompt: ['ω₀ = 10 рад/с. При каком γ колебания исчезают (критический случай)?'],
    build: blanks([{ parts: ['γ = ', { box: '20' }, ' 1/с'], why: 'γ/2 = ω₀ ⇒ γ = 20.', hint: 'Корень √(ω₀² − γ²/4) обращается в ноль.' }]),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    head(p, 'Итоги главы', .2);
    [['⟨A²⟩ = ½A₀²; ⟨P⟩ = ½γmω²x₀².', 'w1'],
      ['Q = 2π · запас / потери за цикл.', 'w2'],
      ['x = A e^{−γt/2} cos ωᵧ t.', 'w3'],
      ['γ/2 > ω₀ — колебаний нет, спад.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 230 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      subify(T(g, str, { x: 260, size: 36, weight: 600 }));
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика 1', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-Q', prompt: ['Камертон: ω₀ = 2700 рад/с, γ = 0,9 1/с. Найдите Q.'],
    build: blanks([{ parts: ['Q = ', { box: '3000' }], why: '2700/0,9 = 3000.', hint: 'Q = ω₀/γ.' }]),
  }, {
    id: 'p-heat', prompt: ['Амплитуду тока удвоили. Во сколько раз выросла тепловая мощность?'],
    build: blanks([{ parts: ['в ', { box: '4' }, ' раза'], why: 'P ∝ I₀².', hint: '⟨P⟩ = ½RI₀².' }]),
  }], done, 'Практика по главе   1 из 2') }],

  ['final2', 'Практика 2', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-wg', prompt: ['ω₀ = 5, γ = 6. Найдите ωᵧ.'],
    build: blanks([{ parts: ['ωᵧ = ', { box: '4' }], why: '√(25 − 9) = 4.', hint: 'ωᵧ = √(ω₀² − γ²/4).' }]),
  }, {
    id: 'p-half', prompt: ['γ = 0,2 1/с. За какое время амплитуда уменьшится в e раз?'],
    build: blanks([{ parts: [{ box: '10' }, ' с'], why: 'e^{−γt/2} = e⁻¹ ⇒ t = 2/γ = 10 с.', hint: 'Амплитуда ∝ e^{−γt/2}.' }]),
  }], done, 'Практика по главе   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
